name: ci

# Manual remote reproduction of the same final gate used locally. It publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Install verification dependencies
        run: |
          pip install "pre-commit>=4.0.0"
          uv sync --project api --frozen
          npm ci --prefix web
      - name: Fetch the verification base
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop
      - name: Create external volumes required by the Compose model
        run: |
          docker volume create oneledger_pgdata
          docker volume create oneledger_documents
      - name: Run the final gate
        run: scripts/verify.sh
