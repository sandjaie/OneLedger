name: docs

# Publish only. There is no `check` job here on purpose: the pre-commit hook
# runs `python3 scripts/check-docs.py` with `pass_filenames: false`, and that
# script walks the whole tree rather than the staged files — so a CI job would
# run the identical command over the identical 46 documents and report it
# twenty minutes later. The hooks are the gate; see CLAUDE.md.
#
# A repository has one Pages site, so only the default branch publishes.
# `workflow_dispatch` deliberately publishes whatever branch it is run from,
# for looking at a documentation change before merging it.
on:
  push:
    # Not `github.event.repository.default_branch` — the `on:` block cannot
    # read context. Rename the default branch and this line renames with it.
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Publish docs/ as-is
        # The specifications are already static HTML. There is no site
        # generator, and adding one would put a build step between the
        # document you edit and the document you read.
        run: touch docs/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
