<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneLedger Acceptance Log</title>
<style id="css">
  :root {
    --ground: #f2f4f6;
    --surface: #ffffff;
    --surface-sunk: #eceff2;
    --ink: #0f1a22;
    --ink-soft: #48606e;
    --ink-faint: #7b8f9b;
    --rule: #d8dfe4;
    --rule-firm: #b9c5cc;
    --accent: #0b6b5e;
    --accent-soft: #e2efec;
    --pass: #1d7a4c;
    --pass-soft: #e4f2ea;
    --fail: #b3261e;
    --fail-soft: #fbe9e7;
    --blocked: #8a6a1f;
    --blocked-soft: #f7eeda;
    --shadow: 0 1px 2px rgba(15, 26, 34, .06), 0 8px 24px -16px rgba(15, 26, 34, .25);
    --display: ui-serif, "Iowan Old Style", Palatino, Georgia, serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1418;
      --surface: #131e24;
      --surface-sunk: #0f191e;
      --ink: #e7eef1;
      --ink-soft: #a3b6bf;
      --ink-faint: #748993;
      --rule: #27373f;
      --rule-firm: #3b4f58;
      --accent: #57bfae;
      --accent-soft: #102b28;
      --pass: #5cc98c;
      --pass-soft: #102a1d;
      --fail: #f08a80;
      --fail-soft: #2d1614;
      --blocked: #d9ae57;
      --blocked-soft: #2a2213;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -18px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1418;
    --surface: #131e24;
    --surface-sunk: #0f191e;
    --ink: #e7eef1;
    --ink-soft: #a3b6bf;
    --ink-faint: #748993;
    --rule: #27373f;
    --rule-firm: #3b4f58;
    --accent: #57bfae;
    --accent-soft: #102b28;
    --pass: #5cc98c;
    --pass-soft: #102a1d;
    --fail: #f08a80;
    --fail-soft: #2d1614;
    --blocked: #d9ae57;
    --blocked-soft: #2a2213;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -18px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }

  /* ---------- masthead ---------- */
  .masthead { padding-block: 40px 20px; }
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 10px;
  }
  h1 {
    font-family: var(--display); font-weight: 400; font-size: clamp(2.1rem, 5vw, 3.1rem);
    line-height: 1.04; letter-spacing: -.02em; margin: 0 0 14px; text-wrap: balance;
  }
  .standfirst { max-width: 46rem; margin: 0; color: var(--ink-soft); font-size: 1rem; }
  .howto {
    margin: 22px 0 0; padding: 16px 18px; border: 1px solid var(--rule);
    border-left: 3px solid var(--accent); border-radius: 4px; background: var(--surface);
    box-shadow: var(--shadow);
  }
  .howto h2 { font-family: var(--body); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
  .howto ul { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 14px; }
  .howto li + li { margin-top: 5px; }
  .howto b { color: var(--ink); font-weight: 600; }

  /* ---------- sticky control bar ---------- */
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    margin-block: 26px 22px; padding: 12px 14px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
  }
  .tally { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .tally-figure { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .tally-figure b { font-size: 15px; font-weight: 500; }
  .tally-sep { color: var(--rule-firm); }
  .meter { flex: 1 1 100%; height: 5px; border-radius: 3px; background: var(--surface-sunk); overflow: hidden; display: flex; }
  .meter span { display: block; height: 100%; }
  .meter .m-pass { background: var(--pass); }
  .meter .m-fail { background: var(--fail); }
  .meter .m-blocked { background: var(--blocked); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--rule-firm); background: transparent; color: var(--ink-soft);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* On the dark ground the accent is light, so pressed chips need dark text. Scoped to the
     dark states only — in light mode the accent is deep teal and keeps white text. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #08171a; }
  }
  :root[data-theme="dark"] .chip[aria-pressed="true"] { color: #08171a; }
  .chip:focus-visible, .verdict button:focus-visible, .note:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sync { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: 1 1 100%; }

  /* ---------- phase sections ---------- */
  .phase { margin-block: 34px 0; scroll-margin-top: 90px; }
  .phase-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--rule-firm); }
  .phase-num { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; }
  .phase-head h2 { font-family: var(--display); font-weight: 600; font-size: 1.32rem; letter-spacing: -.01em; margin: 0; }
  .phase-state { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; }
  .phase-note { margin: 10px 0 0; color: var(--ink-soft); font-size: 13.5px; max-width: 48rem; }

  /* ---------- case ---------- */
  .case {
    margin-top: 14px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 5px; border-left: 3px solid var(--rule-firm); overflow: hidden;
  }
  .case[data-verdict="pass"] { border-left-color: var(--pass); }
  .case[data-verdict="fail"] { border-left-color: var(--fail); }
  .case[data-verdict="blocked"] { border-left-color: var(--blocked); }
  .case-head { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; }
  .case-id { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); padding-top: 3px; flex: 0 0 auto; }
  .case-title { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.35; flex: 1 1 auto; }
  .case-why { margin: 3px 0 0; font-size: 13px; color: var(--ink-soft); }
  .stamp {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; flex: 0 0 auto; align-self: flex-start;
    background: var(--surface-sunk); color: var(--ink-faint);
  }
  .case[data-verdict="pass"] .stamp { background: var(--pass-soft); color: var(--pass); }
  .case[data-verdict="fail"] .stamp { background: var(--fail-soft); color: var(--fail); }
  .case[data-verdict="blocked"] .stamp { background: var(--blocked-soft); color: var(--blocked); }
  .toggle {
    font: inherit; font-family: var(--mono); font-size: 11px; background: transparent;
    border: 1px solid var(--rule-firm); border-radius: 3px; color: var(--ink-soft);
    padding: 3px 8px; cursor: pointer; flex: 0 0 auto;
  }
  .case-body { padding: 0 16px 14px; border-top: 1px solid var(--rule); padding-top: 13px; }
  .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 5px; }
  .pre { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }
  ol.steps { margin: 0 0 14px; padding-left: 20px; font-size: 14px; }
  ol.steps li + li { margin-top: 5px; }
  .accepted { padding: 11px 13px; border-radius: 4px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); }
  .accepted p { margin: 0; font-size: 14px; }
  .also { margin: 11px 0 0; padding: 10px 13px; border-radius: 4px; background: var(--surface-sunk); font-size: 13.5px; color: var(--ink-soft); }
  .verdict { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
  .verdict button {
    font: inherit; font-size: 13px; padding: 6px 13px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--rule-firm); background: transparent; color: var(--ink-soft);
  }
  .verdict button:hover { border-color: var(--ink-soft); color: var(--ink); }
  .verdict button[aria-pressed="true"][data-v="pass"] { background: var(--pass); border-color: var(--pass); color: #fff; }
  .verdict button[aria-pressed="true"][data-v="fail"] { background: var(--fail); border-color: var(--fail); color: #fff; }
  .verdict button[aria-pressed="true"][data-v="blocked"] { background: var(--blocked); border-color: var(--blocked); color: #fff; }
  .note {
    display: block; width: 100%; margin-top: 9px; padding: 9px 11px; font: inherit; font-size: 13.5px;
    color: var(--ink); background: var(--surface-sunk); border: 1px solid var(--rule);
    border-radius: 4px; resize: vertical; min-height: 40px;
  }
  .note::placeholder { color: var(--ink-faint); }

  .empty { margin-top: 24px; padding: 24px; text-align: center; color: var(--ink-faint); border: 1px dashed var(--rule-firm); border-radius: 5px; }
  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--ink-faint); font-size: 12.5px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media print {
    .bar, .filters, .toggle, .verdict button:not([aria-pressed="true"]) { display: none !important; }
    body { background: #fff; color: #000; font-size: 11pt; }
    .case { break-inside: avoid; box-shadow: none; }
    .case-body { display: block !important; }
  }
</style>
</head>

<script id="phases" type="application/json">[{"phase": "0.1", "label": "Phase 0.1", "title": "Local runtime and repository safeguards", "note": "Mostly infrastructure. Only the first case is checkable from the app; the rest is a one-time confirmation someone shows you."}, {"phase": "0.2", "label": "Phase 0.2", "title": "Household data and authorization boundary", "note": "The two live sign-in gates below are recorded in the project's own status as <strong>still outstanding</strong> owner evidence. Treat them as real work."}, {"phase": "0.3", "label": "Phase 0.3", "title": "FX and reporting foundation", "note": null}, {"phase": "0.4", "label": "Phase 0.4", "title": "Accounts and manual ledger", "note": "Worth knowing first: the reporting currency pair locks once the first import freezes amounts. If you want a different pair, change it in Settings before importing."}, {"phase": "0.5", "label": "Phase 0.5", "title": "Import and document foundation", "note": null}, {"phase": "1.1", "label": "Phase 1.1", "title": "Statements land in the ledger", "note": null}, {"phase": "1.2", "label": "Phase 1.2", "title": "All supported statement layouts", "note": null}, {"phase": "1.3", "label": "Phase 1.3", "title": "Classification and transfers", "note": "The hand-checked month is the single most important case in this document."}, {"phase": "1.4", "label": "Phase 1.4", "title": "Cards, net worth and trends", "note": null}, {"phase": "1.5", "label": "Phase 1.5", "title": "Statement-guided onboarding and owner decisions", "note": null}, {"phase": "1.6", "label": "Phase 1.6", "title": "Investments", "note": "Several cases need your real consolidated fund statement. Without it they are <em>Can't test yet</em>, not failures."}, {"phase": "1.7", "label": "Phase 1.7", "title": "Salary and a thin forecast", "note": null}, {"phase": "1.8", "label": "Phase 1.8", "title": "Layout mapper and documents", "note": null}, {"phase": "2.1", "label": "Phase 2.1", "title": "Complete historical coverage", "note": "Only meaningful once you have imported every statement you can actually obtain back to January 2024."}, {"phase": "2.2", "label": "Phase 2.2", "title": "Wealth history and attribution", "note": "Read the Residual line yourself, month by month — Data health does not flag a non-zero residual on an otherwise complete month."}, {"phase": "2.3", "label": "Phase 2.3", "title": "Classification learning and review depth", "note": "The retroactive pass has <strong>no undo</strong>. Read that case before running it."}, {"phase": "2.4", "label": "Phase 2.4", "title": "Data quality and recovery", "note": "The backup and restore drill run outside the app; what you accept here is what Data health reports about them."}, {"phase": "3.1", "label": "Phase 3.1", "title": "Commitments and actions", "note": null}, {"phase": "3.2", "label": "Phase 3.2", "title": "Cash forecast and monthly review", "note": null}, {"phase": "3.3", "label": "Phase 3.3", "title": "Goals and emergency reserve", "note": null}, {"phase": "3.4", "label": "Phase 3.4", "title": "Protection and administration", "note": null}, {"phase": "4.1", "label": "Phase 4.1", "title": "Budgets, recurring discovery and subscriptions", "note": null}, {"phase": "4.2", "label": "Phase 4.2", "title": "Salary analysis", "note": null}, {"phase": "4.3", "label": "Phase 4.3", "title": "Investment analysis", "note": null}, {"phase": "4.4", "label": "Phase 4.4", "title": "FX and remittance analysis", "note": "The newest work, merged today. Nothing here has been owner-accepted yet."}, {"phase": "4.7", "label": "Phase 4.7", "title": "Owner workspace experience", "note": "<strong>Superseded by Phase 4.8 and never owner-accepted.</strong> Listed only so nothing looks missing — there is nothing here to sign off."}, {"phase": "4.8", "label": "Phase 4.8", "title": "Compact financial console", "note": null}, {"phase": "Invariants", "label": "Cross-cutting", "title": "The guarantees behind every screen", "note": "The eight financial invariants and the privacy boundary. Spot-check these at least once — they are what makes every figure above trustworthy."}]</script>

<script id="cases" type="application/json">[{"phase": "0.1", "title": "The app starts on my own machine and nothing private is in the repository", "why": "If the local stack does not come up cleanly, or if a statement or secret ever reaches the code repository, every later check is either impossible or unsafe.", "precondition": "The local stack has been started (database, service and web app) and you have the sign-in address for the workspace.", "steps": ["Open the workspace address in your browser.", "Confirm the sign-in page appears rather than a blank page or a connection error.", "Sign in and confirm the workspace loads with the left navigation showing the groups Money, Build & plan, Review and Workspace."], "expected": "The workspace opens and every navigation group is present. This phase is otherwise infrastructure and is not owner-verifiable in the app: the remaining criteria (secrets and statements excluded from the repository, database built from empty) are one-time confirmations someone must show you once, not screens you can check.", "also_check": null, "id": "01-1"}, {"phase": "0.2", "title": "Only my own Google account can get in", "why": "This is the whole boundary around my financial life; if any other Google account can reach the workspace, nothing else in the product matters.", "precondition": "Sign-in is configured with your permitted Google address, and you have a second Google account available to test rejection with.", "steps": ["Sign out of the workspace using Sign out in the top right.", "Open the workspace address again and sign in with your permitted Google account.", "Sign out, open the workspace again, and this time choose your second, non-permitted Google account at the Google chooser."], "expected": "The permitted account lands in the workspace with your figures. The second account lands on a page headed 'This account is not authorized' saying to use the Google account configured for this private workspace, and no financial figure, account name or amount is visible anywhere on it.", "also_check": "From the rejection page, use Sign in again and pick the permitted account instead → the chooser offers the switch and the permitted account gets in. This live two-account check is recorded as still outstanding, so treat it as a real gate, not a formality.", "id": "02-1"}, {"phase": "0.2", "title": "Signing out really ends the session", "why": "If signing out only hides the screen, an old browser tab or a restored session could still read my ledger.", "precondition": "You are signed in to the workspace.", "steps": ["From any screen, click Sign out in the top right.", "When the sign-in page appears, use the browser's Back button to return to the workspace.", "Try to open Accounts directly from the address bar."], "expected": "Both attempts land on sign-in, never on a cached copy of your figures. If sign-out could not be confirmed with the server you instead see a clear message saying the workspace remains open and to retry sign out — a silent failure is not acceptable.", "also_check": null, "id": "02-2"}, {"phase": "0.3", "title": "I can see the exact exchange rate the ledger used for any date, and where it came from", "why": "Every cross-currency figure I read depends on these rates; if I cannot see the rate and its source for a date, I cannot defend any converted total.", "precondition": "Rate history has been loaded back to the agreed starting date.", "steps": ["Go to Settings in the left navigation, then choose Exchange rates in the section list.", "Under Stored rate, pick a date in FX date and click Check FX rate.", "Read the rate, the Source line and the Carry line for each pair shown.", "Repeat for a weekend or public-holiday date."], "expected": "For each date the rate appears as a full decimal figure (not rounded to two places), with its Source named and Carry reading either 'Direct rate' or 'Carried from' an earlier date. For a weekend or holiday the Carry line names the earlier date it was carried from rather than inventing a rate or showing nothing.", "also_check": "Pick a date well before the agreed starting date → the screen says plainly that no rates are stored for that date; it does not invent one.", "id": "03-1"}, {"phase": "0.3", "title": "I can fill a gap in rate history myself", "why": "A missing rate silently blocks conversions and net worth for that month; I need to be able to fix it without help.", "precondition": "You have identified a date or short range where Check FX rate reported no stored rates.", "steps": ["In Settings › Exchange rates, under Backfill rates, enter a Start date and End date covering the gap.", "Click Backfill rates and wait for it to finish.", "Go back to Stored rate and check a date inside that range with Check FX rate."], "expected": "The backfill reports how many rates it wrote, and the previously empty date now returns a rate with its source and carry-forward status. Re-running the same range does not duplicate or change rates that were already correct.", "also_check": "Enter an end date before the start date → it is refused with a message and nothing is written.", "id": "03-2"}, {"phase": "0.4", "title": "Every account I really hold can be recorded, with the right sign", "why": "If a card or loan is stored as a positive amount, or a deposit as a negative one, net worth is wrong by twice the balance and I would not know.", "precondition": "A list of the accounts you actually hold in both countries, with the balance and date you are taking each opening figure from.", "steps": ["Go to Accounts and click Add account.", "Fill Account name, Institution, Account type, Currency and Country, then the opening figure — note the field is labelled Opening balance for an asset and Amount owed for a card or loan.", "Enter Opening balance date and an Opening balance note saying where the figure came from, then click Create account.", "Repeat for at least one asset account and one card or loan, then read the Position summary strip at the top of Accounts."], "expected": "Each account appears under Accounts by role with its balance in its own currency. Assets add to the Assets figure and the card or loan adds to Liabilities — you never have to type a minus sign for money you owe, and no amount is shown under the wrong heading.", "also_check": "Type an opening figure with five decimal places → it is refused with a message saying money takes at most four decimal places, and nothing is saved.", "id": "04-1"}, {"phase": "0.4", "title": "An opening balance I typed from memory is marked as unconfirmed until I say so", "why": "A figure I read off a banking app is a claim, not evidence; if it silently counts as proven, I will trust a number I never checked.", "precondition": "At least one account created with an opening balance, not yet acknowledged.", "steps": ["On Accounts, find the account you just created and read its Status and Evidence columns.", "Use Show accounts needing evidence in the toolbar to filter to accounts awaiting evidence.", "Click Acknowledge opening balance on that account.", "Now click Edit on the same account, change the opening balance or its date, and save."], "expected": "Before acknowledgement the account is listed as needing confirmation and appears in the needs-evidence filter. After Acknowledge opening balance it leaves that filter. After you edit the opening figure or its date it returns to needing confirmation — an old acknowledgement never carries over to a new number.", "also_check": null, "id": "04-2"}, {"phase": "0.4", "title": "Closing an account keeps its history", "why": "I close accounts when I move countries or switch banks; if closing erases them, every past month's total silently changes.", "precondition": "An account with at least one recorded transaction or an acknowledged opening balance.", "steps": ["On Accounts, click Close on that account.", "Scroll to the Closed accounts section at the bottom and expand it.", "Open Transactions and filter by that account to check its rows are still there.", "Back on Accounts, click Reopen on the same account."], "expected": "The closed account moves into its own Closed accounts group showing its closing date, its rows remain in Transactions, and the Assets or Liabilities totals at the top of Accounts change by exactly that account's balance. Reopen puts it back in the open list unchanged.", "also_check": null, "id": "04-3"}, {"phase": "0.4", "title": "A transaction I type in myself is stored exactly, in both currencies, and cannot drift", "why": "Hand-entered cash and reimbursements have no statement behind them; if their amounts or converted values shift later, my totals stop being reproducible.", "precondition": "At least one account exists and rate history covers the date you will use.", "steps": ["Go to Transactions and click Record a transaction.", "Choose the Account, Date, Description, Amount (signed) — a minus for money out — a Type and optionally a Category, then click Record transaction.", "Find the new row in the ledger below and read the small print under its amount.", "Switch the reporting currency using the two currency buttons in the top right, and read the row again."], "expected": "The row shows the amount you typed to the exact digits, plus the FX rate and rate date used and whether that rate was carried forward. Switching the currency button changes which of the two stored figures is shown, and switching back shows the original figure unchanged — the converted value never moves on a later visit.", "also_check": "Try to edit the amount of a saved row → there is no way to change it; only its category and note are editable.", "id": "04-4"}, {"phase": "0.4", "title": "Group totals add up per currency and are never mixed", "why": "If balances in two currencies are added together without a stated rate and date, the total is meaningless and I might act on it.", "precondition": "Accounts in at least two different currencies.", "steps": ["On Accounts, expand Grouped native totals.", "Read the Group, Currency, Total and Evidence columns.", "Compare each group total against the accounts listed above it."], "expected": "Every total is shown against one named currency and matches the sum of that group's accounts in that currency exactly. No single combined figure appears without a currency, and each row carries its evidence date or says plainly that there is no shared date.", "also_check": null, "id": "04-5"}, {"phase": "0.5", "title": "Every statement I upload is kept, and I can get back to the original", "why": "If I cannot reopen the exact PDF a figure came from, I cannot answer a question from a bank or a tax authority.", "precondition": "At least one statement has been imported.", "steps": ["Go to Documents in the left navigation.", "Find a statement in the library and read its Account, Period, Import state and Provenance.", "Click Original to open the stored PDF.", "Back on the row, click Transactions to see the rows that came from that document."], "expected": "The original PDF opens, and the Transactions link shows exactly the ledger rows extracted from it. Each row in Transactions also carries an Imported marker and its own way back to the source document.", "also_check": "Check that no full account number or card number appears anywhere in the library list, only masked values.", "id": "05-1"}, {"phase": "0.5", "title": "The same file cannot be stored twice", "why": "Uploading last month's statement again by accident must not create a second copy or a second set of transactions.", "precondition": "A statement you have already imported, and the same file still on disk.", "steps": ["Go to Import, select the identical file again under Statement files, and click Check statements.", "Read the message on the file's card.", "Go to Documents and count the entries for that period and account."], "expected": "The re-upload is refused with a message saying the file is already in the document library, and Documents still shows one entry for that statement — not two.", "also_check": "Rename the file on disk and upload it again → it is still recognised as the same document, because recognition is on content, not filename.", "id": "05-2"}, {"phase": "1.1", "title": "One real statement goes in end to end, and I decide before anything lands", "why": "This is the monthly job I will do forever; if rows can enter the ledger without my review, or the period's total does not match the statement, the ledger is not trustworthy.", "precondition": "One real bank or card statement PDF for an account that already exists in Accounts.", "steps": ["Go to Import, choose the file under Statement files, leave Account as 'Detect from the statement', and click Check statements.", "Read the summary on the card: Period, Rows, Declared closing, and the reconciliation line.", "Click Stage batch, then Review this batch.", "On Review, select the rows you want, click Accept selected, then click Import.", "Open Transactions, filter to that account and period, and compare the rows and closing figure against the paper statement."], "expected": "Before staging, the card states the statement's period, its row count and its declared closing figure, and says the opening plus the rows reconcile to that closing. The staged batch says 'Staged for review. Nothing is in the ledger yet.' Only after Import do the rows appear in Transactions, the count imported matches the count you accepted, and the account's balance in Accounts equals the statement's closing figure to the last digit.", "also_check": "After importing, if some rows had no category the Review screen tells you how many and points you to Transactions → Needs a category.", "id": "11-1"}, {"phase": "1.1", "title": "A statement whose figures do not add up is not allowed in", "why": "A statement that silently loses a row would understate my spending forever, and I would have no way to spot it.", "precondition": "A statement PDF whose layout the app has not fully mastered, or any statement where the check below reports a mismatch. If everything you own reconciles, confirm this with whoever set the app up rather than forcing a failure.", "steps": ["Go to Import, select the file, and click Check statements.", "Read the highlighted reconciliation message on the card.", "Look for a Stage batch button."], "expected": "The card explains the arithmetic in plain terms — the opening figure, how many rows were read, what they compute to, what the statement declares, and the difference — and there is no Stage batch button at all; instead you are offered Remap this layout. Nothing reaches the ledger.", "also_check": "Any row the app could not read is listed with its page and row number and a reason, rather than being quietly dropped.", "id": "11-2"}, {"phase": "1.1", "title": "Abandoning an import leaves no trace", "why": "If I change my mind mid-import, half a statement in the ledger would be worse than none.", "precondition": "A statement staged but not yet imported.", "steps": ["Open the staged batch from Import using Review this batch.", "Click Discard this batch and read the confirmation text.", "Click the Discard button to confirm.", "Check Transactions for that account and period, then go back to Import and check the same file again."], "expected": "The screen confirms how many staged rows were discarded and that nothing was imported. Transactions shows no rows from that statement, and the same account and period are free to import again.", "also_check": "Choose Keep it at the confirmation instead → the batch and its rows stay exactly as they were.", "id": "11-3"}, {"phase": "1.2", "title": "Every statement format I actually receive imports and reconciles", "why": "A format that does not import means a permanent hole in my history, and I would have to keep that account in my head.", "precondition": "One recent statement from each institution and account you hold — current accounts and cards, both countries.", "steps": ["Go to Import and select one statement from each distinct format in a single selection.", "Click Check statements and wait for every card to finish.", "Read each card's reconciliation line and row counts.", "Stage and import the ones that reconcile, and note any that do not."], "expected": "Every format you hold reaches 'Staged for review' with a reconciled message; for each one the row count and closing figure match the paper statement. Record how many formats passed and how many did not — a format that fails is a real gap, not a rounding issue.", "also_check": "Select several statements for the same account in one go → each file still reports its own period, row count and reconciliation result.", "id": "12-1"}, {"phase": "1.2", "title": "A password-protected statement imports, and the password is not kept", "why": "Most of my card statements are locked, and I do not want my statement password stored anywhere in this app.", "precondition": "A password-protected statement PDF and its password.", "steps": ["Go to Import, select the locked file and click Check statements.", "When the card asks for 'Password for this statement', type it and click Check statements again.", "Stage and import the batch as usual.", "Sign out, sign back in, and check the same file again from Import."], "expected": "With the password the statement parses, reconciles and imports normally, and the field says plainly that the password is used for this file and this check only. On the second visit the app asks for the password again — it was never remembered.", "also_check": "Enter a wrong password → the file is refused with a clear message, nothing is staged, and the password box is still there to retry.", "id": "12-2"}, {"phase": "1.2", "title": "A scanned or photographed statement is refused clearly, not half-read", "why": "A scan the app cannot read must be an honest refusal; a partial read would put invented rows in my ledger.", "precondition": "A scanned or image-only PDF statement (a photo or a scan with no selectable text).", "steps": ["Go to Import, select the scanned file and click Check statements.", "Read the message on its card.", "Check that no Stage batch button is offered, and check Documents and Transactions afterwards."], "expected": "The card says the file is scanned rather than text so no rows can be read from it. There is no way to stage it, and nothing appears in Transactions. It is a clear refusal, not a partial import.", "also_check": "Upload something that is not a PDF at all → the file is marked 'Not uploaded' with a message that only PDF statements are read, and it is never sent to the server.", "id": "12-3"}, {"phase": "1.3", "title": "Every categorised row tells me why it got that category", "why": "If I cannot see whether a category came from a rule I wrote, a starter rule or my own one-off decision, I cannot trust or correct the classification.", "precondition": "At least one imported statement with a mix of categorised and uncategorised rows.", "steps": ["Go to Transactions and expand More filters.", "Under Classification, choose each option in turn — Needs a category, Seed rule, Merchant alias, Owner rule, Owner decision — clicking Apply filters each time.", "Note the count and the Evidence column for the rows each option returns.", "Go to Settings › Rules and read Coverage and analytics, including Rule hits and disagreements."], "expected": "Each Classification option returns only the rows decided that way, and the counts across the options add up to the rows you have. Settings › Rules shows coverage by how rows were classified and by confidence, and no row is categorised without one of these explanations behind it.", "also_check": "In Settings › Rules, add a rule and click 'Check what this matches' before saving → it states how many existing rows the rule would match, and nothing changes until you save it.", "id": "13-1"}, {"phase": "1.3", "title": "Money I move between my own accounts is not income and not spending", "why": "A remittance from one country to the other is not earning or spending; counted as either, my monthly figures are wrong by a very large amount.", "precondition": "Imported statements for both sides of at least one real transfer between your own accounts, in the same month.", "steps": ["Go to Transactions and click Find transfers under the Transfers heading.", "Read the suggested pairs, which appear grouped as High confidence, Probable and Weak suggestions with a score on each.", "Tick the pairs that are genuinely yours and click Confirm selected.", "Go to Spending, set the range to that month, and read This period; then note the Reportable income and Reportable spending figures on Transactions for the same month."], "expected": "Nothing is linked until you tick and confirm it, including high-confidence pairs. After confirming, both legs show as Linked in Transactions, and the month's spending and income totals each fall by exactly the transfer amount — the money appears in neither.", "also_check": "Click Unlink on a confirmed transfer → the two rows return to the totals, and the pair is offered again as a candidate rather than vanishing.", "id": "13-2"}, {"phase": "1.3", "title": "One month I check by hand agrees with the app exactly", "why": "This is the only real proof: if a month I add up myself does not match, every trend and budget built on it is worthless.", "precondition": "One complete month imported for every account you use, with transfers and card payments confirmed and categories settled.", "steps": ["Pick that month and, from the paper statements, add up your spending by hand — excluding money moved between your own accounts and card bill payments.", "Go to Spending, set Month to that month, and read This period and the By category table.", "Open Transactions for the same month and read Reportable income and Reportable spending.", "Expand 'What counts as spending' on the Spending screen and confirm the stated rule matches how you added up."], "expected": "Your hand total and the app's spending figure agree exactly, to the last digit, and each category subtotal agrees with the rows behind it. A refund reduces its category rather than appearing as income.", "also_check": "Click through from a category to its transactions → the rows listed sum to the category figure shown.", "id": "13-3"}, {"phase": "1.4", "title": "What I owe on each card matches the card's own statement", "why": "A card due figure that is wrong or late is how a payment gets missed and interest starts.", "precondition": "At least one card statement imported for a recent cycle.", "steps": ["Go to Overview and find the Cards due section.", "For each card read Card, Statement balance, Minimum due, Due and Utilisation.", "Compare each figure against the card's own statement.", "Where you have already paid the bill in full, check what the Due column says."], "expected": "Statement balance, minimum due and due date match the card statement exactly. Utilisation is shown as a percentage, or says plainly that no limit was stated rather than guessing one. A bill you have paid in full is marked as paid in full rather than still showing as owed.", "also_check": "Check that the card bill payment itself does not appear in Spending for the month — only the purchases do.", "id": "14-1"}, {"phase": "1.4", "title": "Net worth reads the same story in either reporting currency", "why": "I think in two currencies; if the two views disagree, or a figure appears without a date, I cannot use either.", "precondition": "Accounts covering both countries with current balances, and rate history covering the month end.", "steps": ["Go to Overview and read Net position and Liquid balance in the Position summary, including the 'as of' date.", "Switch the reporting currency using the two currency buttons in the top right and read both figures again.", "Expand 'Detailed totals and evidence' and read the Position detail table: Net position, Assets, Liabilities and Liquid for each reporting currency.", "Read the 'Why some figures may be incomplete' section if it appears."], "expected": "Both currencies show a net position with the same as-of date, and assets minus liabilities equals the net position in each. Where a rate or a valuation is missing, the figure reads as unavailable and the incomplete section names the reason and the account — it is never quietly replaced by zero or by a stale number.", "also_check": "A closed or excluded account's balance is not inside the net position, and the screen says so where it matters.", "id": "14-2"}, {"phase": "1.4", "title": "The monthly trend keeps the transfer exclusions I confirmed", "why": "If trends are built on a different set of rows than the monthly totals, two screens will tell me two different things.", "precondition": "At least three months imported, with transfers and card payments confirmed.", "steps": ["Go to Overview and read the Cash flow module and the Income, spending and net trend.", "Expand 'Detailed totals and evidence' and read the Recorded monthly totals table.", "For one month in that table, compare Income, Spending and Net against the same month on the Spending screen and on Transactions.", "Go to Wealth and click Refresh history, then read the Month-end history table and its Coverage column."], "expected": "The month you cross-check matches on all three screens. Months whose statement coverage is incomplete are labelled as such rather than shown as low spending, and Wealth marks each stored month Complete or Incomplete with the reason available.", "also_check": "On Wealth, open one month and read 'What changed' → the movement is broken into named lines with a residual shown last, and the opening plus the lines equals the closing figure.", "id": "14-3"}, {"phase": "1.5", "title": "A statement for an account I have not set up offers to create it, once", "why": "Setting up ten accounts by hand before importing anything is the thing most likely to make me give up; and a duplicate account created by accident would split my history in two.", "precondition": "A statement PDF for an account that does not yet exist in Accounts — ideally two or three statements for that same account.", "steps": ["Go to Import, select all the statements for that unknown account at once, and click Check statements.", "On the card that shows an Identity decision, read the proposed Institution, Account type, Currency and the masked Account number, correcting anything wrong.", "Click 'Create account and continue'.", "Read what the other files for the same account now say, then stage and import each one.", "Go to Accounts and count the entries for that institution."], "expected": "Exactly one identity decision is asked, for the whole group; the other files say the identity will be confirmed from the earliest selected statement and then follow it. Accounts shows one new account, not one per file, and no duplicate institution is created.", "also_check": "If the statement disagrees with an account you already hold, the panel names the conflict — institution, account type or currency — instead of quietly attaching the statement to the wrong account.", "id": "15-1"}, {"phase": "1.5", "title": "Later statements for that account attach themselves, and I can still see the full number when I need it", "why": "I should be asked once per account, not every month; and when a bank asks me to confirm an account number I need to read it from here without it being exposed everywhere.", "precondition": "The account from the previous case, created from a statement, plus another statement for it from a different period.", "steps": ["Go to Import, select the further statement for that account, and click Check statements.", "Read the identity line on its card.", "Stage and import it, then go to Accounts and find that account.", "Click the eye button beside its masked number, then click it again."], "expected": "The new statement reports 'Matched automatically' naming the institution and account, with no identity question asked, and imports normally. On Accounts the number is masked by default; the eye button reveals the full number and hides it again, and the full number appears nowhere else on the screen.", "also_check": "For a card whose statement only ever showed a masked number, the eye button is unavailable and the screen explains that the statement supplied only a masked value — it does not invent the missing digits.", "id": "15-2"}, {"phase": "1.5", "title": "Rows nothing could categorise come and ask me, and my answer is reused", "why": "Uncategorised rows are where my spending picture goes wrong; answering the same question every month would make me stop answering it.", "precondition": "At least one imported statement with rows that no rule categorised.", "steps": ["Go to Transactions, expand More filters, set Classification to 'Needs a category' and click Apply filters.", "On one row, open its actions and choose the option to mark rows like it — the panel is headed 'Mark rows like this?'.", "Check the Pattern, read the line saying how many matching rows there are and how many need a category, then click 'Always mark rows like this'.", "Re-apply the 'Needs a category' filter and check the count.", "On another such row, use 'Just this one' instead."], "expected": "Before you commit, the panel tells you how many existing rows the pattern matches and how many of them are uncategorised. After 'Always mark rows like this' it reports how many rows were categorised, those rows leave the 'Needs a category' filter, and the same description in a future import is categorised without asking again. 'Just this one' changes that single row only and saves no rule.", "also_check": "Type a pattern containing a reference number or digits → it is refused with a message asking for at least three characters without digits, so a one-off reference can never become a permanent rule.", "id": "15-3"}, {"phase": "1.6", "title": "Import my consolidated fund statement and see holdings reconcile", "why": "If the units the app holds do not match the statement, every value, gain and return built on them is wrong.", "precondition": "Your real detailed consolidated mutual-fund statement PDF (and its password, if it has one), and an investment account already set up under Accounts. Blocked until you have that statement to hand.", "steps": ["In the left sidebar under Review, open 'Import investments'.", "Choose the statement under 'Statement file', type the password under 'Password for this statement' if it has one, and press 'Check statement'.", "Press 'Stage import' and read the line above the groups: 'N groups | N rows | N blocking reasons'.", "Press 'Commit ready groups' and read the 'Commit result:' list.", "Follow 'View the portfolio' and compare the Units column in the Holdings table against your statement's current-position section."], "expected": "Every group with no blocking reason reads 'committed' in the Commit result list, and on Investments each holding's Units equals the units printed in your statement's current-position section to the last decimal it prints. The password is never shown again and nowhere asks to be saved.", "also_check": "A group the app cannot recognise keeps its blocking reason and is not committed: after the commit nothing from that group appears in the Holdings table, and it is still listed under 'Reviews'.", "id": "16-1"}, {"phase": "1.6", "title": "Re-importing the same statement does not double my history", "why": "Overlapping monthly statements repeat the same purchases; counting them twice would inflate units, contributions and net worth.", "precondition": "The first investment statement already committed, the same file again, and ideally the companion summary statement covering the same period.", "steps": ["On Investments, note the Units of each holding and the 'Contributions' figure in 'Portfolio totals'.", "Go to Review > 'Import investments', upload the same statement again, press 'Check statement' then 'Stage import'.", "Read the 'N groups | N rows' line and the group list, and press 'Commit ready groups' if anything is offered.", "Return to Investments and compare Units and Contributions with what you noted.", "Repeat steps 2 and 3 with the companion summary statement and open one holding's Events list."], "expected": "Units and Contributions are unchanged, and no holding's Events list gains a second copy of an event that was already there. The summary statement adds no event at all; it only confirms closing units.", "also_check": "If a later monthly statement genuinely contains new activity, only that new activity is staged; the overlapping older rows are not offered again.", "id": "16-2"}, {"phase": "1.6", "title": "A missing price is shown as a gap, never as zero", "why": "A holding silently valued at zero would understate net worth and quietly corrupt gain and return.", "precondition": "At least one holding you own. For the negative half, a holding whose price the app cannot source.", "steps": ["Open Build & plan > Investments.", "In 'Valuation confidence', press 'Check for new prices' if it is offered and read the message that follows.", "Read the 'Official prices' line: 'N mapped | M unmapped | latest <date>'.", "Read the 'Price evidence' and 'Status' cells of every row in the Holdings table, and the top strip."], "expected": "A valued holding shows 'Price <currency> <value> | <date>' with Status 'Valued'. A holding with no price reads 'No dated price recorded.' with Status 'Missing price' and Current value 'Unavailable' -- never a zero. With any holding unvalued the top tile is labelled 'Valued portion' rather than 'Value', and a 'Valuation gaps' note states how many are unvalued and how many stale.", "also_check": "If the price source is down the message reads 'The price source is unavailable; cached prices are kept.' and every price and date already on screen is unchanged.", "id": "16-3"}, {"phase": "1.6", "title": "A purchase shows the cash it came from, and is not counted as spending", "why": "A fund purchase moves money between my own pockets; if it lands in spending, my spending totals and savings rate are wrong.", "precondition": "A committed purchase in a holding, and the bank statement month containing the debit that paid for it already imported.", "steps": ["On Investments, click the holding's name to open it.", "In 'Purchase funding', pick the purchase, choose the matching debit under 'Choose an exact cash debit', and press 'Confirm funding'.", "Read the purchase's funding line and the 'Cash links' list.", "Check Money > Spending for that month, and the 'Cash flow' figures on Money > Overview."], "expected": "The purchase reads 'Funded' and the linked debit is listed under 'Cash links' with its date and amount. Spending for that month does not include the purchase amount, the Overview cash-flow spending figure is unchanged by the link, and net position neither rises nor falls because the link was made.", "also_check": "A proposal alone links nothing: until you press 'Confirm funding' the purchase still reads 'Not fully funded.' A purchase that is already funded cannot be corrected -- the control reads 'Unlink before correcting' / 'Unlink its funding first to correct this event.'", "id": "16-4"}, {"phase": "1.6", "title": "A bonus, split, switch or platform transfer changes units without inventing money", "why": "These restate or move units with no cash at all; read as a contribution or a gain they would make my return and contributions fiction.", "precondition": "A holding you own that has had one of these events on a real statement, with the units and Contributions figures noted before you record it.", "steps": ["Note the holding's Units and the 'Contributions' tile on Investments.", "Open the holding and press 'Record an event'.", "Under 'Unit action' choose the matching kind (Bonus units, Rights, Split, Switch, Systematic transfer or Platform transfer), enter the date and the units or unit ratio exactly as the statement prints them, press 'Review event' and confirm.", "Re-read the Events list, the holding's Units, and the Contributions tile.", "Check Money > Spending and the Overview income figure for that date."], "expected": "Units change by exactly the event's own effect, Contributions is unchanged, and every event dated before the action still shows the same units, price and net cash as before. Nothing appears in spending or income for that date.", "also_check": "Using 'Correct' on an earlier event appends a correction: the original row stays visible marked 'Corrected' and is not rewritten, and the screen tells you to 'Refresh Wealth' to bring history up to date.", "id": "16-5"}, {"phase": "1.6", "title": "Allocation adds up, or says it cannot", "why": "An allocation whose slices quietly drop an unvalued holding would make me think I know my mix when I do not.", "precondition": "At least two holdings you own; ideally one of them unvalued so both halves can be checked.", "steps": ["Open Investments and scroll to 'Allocation'.", "Read the exact values shown for each asset-class group, then open the 'Allocation by account' disclosure.", "Add the Value column yourself and compare it with the 'Value' (or 'Valued portion') figure in 'Portfolio totals'."], "expected": "With every holding valued, the Value column adds exactly to the portfolio value figure and the Ratio column adds to 1. With any holding unvalued, an 'Incomplete allocation' note says ratios cover only the valued evidence, and any group whose denominator is incomplete shows 'Not available' instead of a percentage.", "also_check": null, "id": "16-6"}, {"phase": "1.6", "title": "The portfolio return agrees with my own calculation", "why": "A return number I cannot reproduce is not evidence, and a wrong one would change how I judge every investment decision I have made.", "precondition": "A holding with a complete recorded history -- every purchase, sale, distribution and charge -- and your own XIRR of the same dated cash flows worked out independently, for example in a spreadsheet.", "steps": ["On Investments, read the 'XIRR' tile in 'Portfolio totals'.", "Open the holding and list its Events with dates and Net cash, plus its current value and price date.", "Work the same dated flows through your own XIRR and compare the two figures."], "expected": "The XIRR tile shows a percentage agreeing with your independent figure to within 0.01 percentage points, with 'Portfolio cash-flow return' beneath it.", "also_check": "Where the history cannot support a return the tile reads 'Unavailable' with a stated reason such as 'No sign change across the cash flows.', 'A dated price is missing.', 'History includes a switch, transfer or split.' or 'An unrecognized event blocks this calculation.' -- never a zero or a guess.", "id": "16-7"}, {"phase": "1.6", "title": "Investment value reaches net worth once, in both currencies", "why": "Counting the same holding twice, or missing it, makes the single number I trust most wrong.", "precondition": "At least one valued holding and the cash account that funded it, both marked 'Include in net worth' on Accounts.", "steps": ["Open Money > Overview and read the 'Net position' tile.", "Switch the reporting currency with the buttons in the top bar and read 'Net position' again.", "Open the position detail and find both the holding and the account that funded it.", "Read the 'Why some figures may be incomplete' list beneath."], "expected": "The holding appears once in the position detail with its own price date; net position in each reporting currency equals the assets less liabilities listed there; and the holding's value is not also sitting inside its account's balance. Any unvalued holding, missing snapshot or carried exchange rate is named in 'Why some figures may be incomplete' rather than silently included.", "also_check": "A holding you have fully sold shows only when 'Show N closed holdings' is ticked on Investments, reads zero units, adds nothing to net position, and keeps its events readable.", "id": "16-8"}, {"phase": "1.7", "title": "Enter a payslip exactly as printed, and have a wrong one refused", "why": "A payslip stored when its own totals disagree would put a figure in my income history that the payslip does not support.", "precondition": "One of your real payslips to read from.", "steps": ["Open Build & plan > Salary and follow the 'Enter' link.", "Fill Pay month, Currency, Gross earnings, Total deductions and Net pay exactly as printed, and add every payment and deduction line with 'Add earning line' and 'Add deduction line'.", "Submit, then read the 'Payslips' list.", "Repeat with one line amount deliberately altered so the totals no longer agree, and submit."], "expected": "The correct payslip appears in the Payslips list with its month, gross, deductions and net exactly as typed, and its lines listed beneath. The deliberately wrong one is refused with a stated reason, nothing is added to the list, and no transaction is created anywhere.", "also_check": "'Correct' on a recorded payslip pre-fills the form; submitting it adds a new payslip while the earlier one stays readable as 'Superseded'. While a payslip is linked to a credit the control reads 'Unlink before correcting'.", "id": "17-1"}, {"phase": "1.7", "title": "Import a multi-month payslip PDF, then import it twice", "why": "Payroll PDFs arrive with several months in one file; importing one twice would double my recorded income.", "precondition": "A real payslip PDF covering more than one month, and its password if it has one. Only the supported monthly pay advice layout is read.", "steps": ["On Salary, follow 'Import', choose the PDF under 'Payslip file' and enter 'Password for this file' if needed.", "Press 'Check file' and read the per-month preview: each month's gross, deductions, net and whether it reconciles.", "Press 'Import reconciling months' and read the outcome for each month.", "Import the very same file again and compare the 'Payslips' list and its count."], "expected": "Every month in the file is previewed with its own figures. Only months whose payment lines, deduction lines and net agree are imported; any other month is named with its own reason and stores nothing, without stopping the rest. The second import adds no payslip and the count is unchanged.", "also_check": "A PDF in any other layout reads 'This file's layout is not supported.' and stores nothing, and no bank, branch, account, employee or employer line from the payslip appears anywhere on screen.", "id": "17-2"}, {"phase": "1.7", "title": "Link net pay to the one bank credit that paid it", "why": "That link is what ties payroll evidence to money that actually arrived; a wrong or doubled link would misstate my income.", "precondition": "A recorded payslip and the bank statement month containing its net-pay credit already imported.", "steps": ["On Salary find the payslip (it reads 'Not linked') and press 'Find net-pay credit'.", "Read the candidate list, press 'Link' on the matching credit and then 'Confirm link'.", "Note the row's new state, then check the income figure on Money > Overview and the month's total on Money > Spending.", "Press 'Unlink' and check those same two figures again."], "expected": "The payslip reads 'Linked | <credit date>', and that same credit is not offered as a candidate for any other payslip. Income, spending and net position are identical before the link, after the link and after unlinking; nothing is posted by linking.", "also_check": "When no eligible credit exists the panel reads 'No eligible credit was found.' rather than offering an approximate match.", "id": "17-3"}, {"phase": "1.7", "title": "Count a payroll deduction as spending without moving my balances", "why": "Something like an employer-arranged flight paid out of gross pay is real spending; leaving it out flatters my savings rate, and posting it badly would break statement reconciliation.", "precondition": "A payslip already linked to its net-pay credit, with a deduction line that is genuinely personal spending, and an active expense category to put it in.", "steps": ["On Salary, expand that payslip's lines.", "On the deduction line choose the category, then tick 'Count as spending'.", "Check the account's balance on Money > Accounts and the month's total on Money > Spending.", "Untick 'Count as spending' and check both again."], "expected": "The deduction appears in Spending for the credit's date under the category chosen, and a matching 'Payroll: <label> withheld' entry appears in income -- so the account balance, statement reconciliation and net position are all unchanged. Unticking removes both entries and returns the figures to where they were.", "also_check": "Unticking also forgets the saved rule for that deduction label, so the same label on a later payslip is not counted as spending again until you tick it. Ticking is refused on an earning line.", "id": "17-4"}, {"phase": "1.7", "title": "A commitment moves the 30/60/90-day projection exactly, and posts nothing", "why": "I plan around this projection; if a commitment does not move it by its own amount, or if it silently posts a transaction, both the plan and the ledger become untrustworthy.", "precondition": "At least one active account with a ledger balance and a balance date.", "steps": ["Open Build & plan > Plans and read one account's start balance and date and its 30, 60 and 90-day balances in the 'Forecast' section.", "In 'Commitments', press 'Create plan' with a Label, Amount, Cadence and First date falling inside the next 90 days on that account.", "Read that account's 30/60/90 figures again and the occurrences listed against them.", "Open 'Forecast assumptions and exclusions', then check Money > Transactions for that account.", "Archive the commitment and read the figures once more."], "expected": "Each projected balance moves by exactly the commitment amounts dated on or before that date, and each applied occurrence is listed with its own date. The assumptions state that balances start from each account's latest ledger balance and its date and that 'A forecast posts nothing.' No new transaction exists in Transactions, and archiving returns every figure to what you first read.", "also_check": "An account or commitment the forecast cannot use is listed under 'Accounts not forecast' or 'Commitments not applied' with its reason -- never projected as zero and never converted into another currency.", "id": "17-5"}, {"phase": "1.8", "title": "Map a statement layout the app has never seen, without a developer", "why": "If a new bank format needs code, my history stops at whatever formats already exist.", "precondition": "A statement PDF in a layout no saved layout identifies -- the check refuses it saying no saved layout identifies this statement.", "steps": ["Open Review > Import, choose the file under 'Statement files' and press 'Check statements'.", "On the refused file press 'Map this layout' and fill the form: name, account type, 'Fingerprints', 'Skip line patterns', 'Column bands', 'Metadata patterns', date format and sign convention.", "Press 'Preview' and read 'Mapped rows', the verdict and any row failures.", "Adjust the bands until the preview reconciles, then press 'Save layout'.", "Carry the same file on through account confirmation and staging, open 'Review this batch' and commit it."], "expected": "Preview shows your rows mapped, a matched verdict with no row failures and 'This draft identifies the file.' Save then becomes available; the same file continues through confirmation, staging and review and its rows land in the ledger with no code change. A second statement in that same layout is later identified without any mapping at all.", "also_check": "Save stays unavailable with its reason shown when the preview does not reconcile, when the draft does not identify the file, when it does not capture exactly one account number, or when you edit the form after previewing ('Preview again after editing.'). No account number ever appears unmasked in the verdict or the row failures.", "id": "18-1"}, {"phase": "1.8", "title": "Re-read descriptions with a better layout, after seeing what would change", "why": "An early layout can mangle narration; I need it fixed without a blind rewrite of rows I have already classified.", "precondition": "A completed statement import whose layout has since been saved at a higher version, so its Documents row offers 'Re-read descriptions'. This is the owner-operated part of this phase: it needs the real encrypted statement whose narration repeats a header word.", "steps": ["Open Review > Documents and find that document (it also appears under 'Needs action').", "Press 'Re-read descriptions' and, if the document is password protected, type its password.", "Press 'Preview re-read' and read the counts.", "Press 'Apply', read the counts again, then open Review > Classify."], "expected": "The preview reads 'N rows compared | M descriptions would change' and changes nothing until Apply is pressed. After Apply the same line adds how many rows were queued for review, and those rows appear in the Classify queue rather than being silently re-categorised. Record only these three counts -- never the narration itself.", "also_check": "A wrong password leaves everything as it was, with 'The re-read could not be completed. Check the password and retry.'", "id": "18-2"}, {"phase": "1.8", "title": "Find any stored document by type, account, period and import state", "why": "When a figure looks wrong I need to reach the original paper behind it in seconds.", "precondition": "Documents of more than one kind stored -- bank statements, an investment statement and a payslip.", "steps": ["Open Review > Documents.", "Set 'Type', 'Account' and 'Import status', open 'Advanced filters' for 'Period from' and 'Period to', and press 'Apply filters'.", "Read the Document, Account, Period, Import state and Provenance columns, and open 'Details for ...' on one row.", "Press 'Original' on a statement row."], "expected": "Only documents matching every filter are listed, with a count and 'Load N more' when there are more. Each row shows its account with a masked number, its period -- labelled '(derived from the rows)' when it came from the rows rather than the statement -- its import state and, for statements, its reconciliation status, pages, upload date and layout version. 'Original' opens the stored PDF itself. Payslips and investment statements carry no period or account and so drop out as soon as either of those filters is set.", "also_check": "No filename, storage location, note, hash or complete account number appears anywhere in the list, the details or the downloaded file's name.", "id": "18-3"}, {"phase": "1.8", "title": "Trace any imported transaction back to its page and row", "why": "Without the page and row behind a figure I cannot settle a disagreement with the bank.", "precondition": "At least one committed statement import.", "steps": ["On Review > Documents press 'Transactions' on a statement row.", "Confirm the 'Source document id' filter on the Transactions screen carries that document.", "Open the row-level more-actions menu on an imported row.", "Follow the 'Page P | row R' link."], "expected": "The Transactions list shows only rows from that document, each marked 'Imported'; the menu on each row names its exact page and row number, and following it opens that document's original PDF. A row you entered by hand carries no page or row.", "also_check": null, "id": "18-4"}, {"phase": "2.1", "title": "See every month since January 2024 accounted for, per account and for payslips", "why": "History that silently starts late looks complete when it is not, and every trend built on it is wrong.", "precondition": "Your bank, card and salary-account statements imported as far back as you have them. This case is only meaningful once you have gathered and imported all the statements you can actually obtain.", "steps": ["Open Review > Coverage.", "Open 'Coverage scope and anchor' and read the history anchor.", "Read the strip -- 'Needs review', 'Acknowledged', 'Reconciled' -- and the status legend.", "Read across one account's row and the 'Payslips' row, month by month."], "expected": "The anchor reads 2024-01-01 and cannot be changed from the app. Every statement-sourced account and a 'Payslips' row show one labelled cell per month from that anchor to this month, each reading exactly one of Reconciled, Acknowledged, Partial, Missing, In progress or Outside account life -- in words, not colour alone -- and the counts in the strip agree with the grid.", "also_check": "Importing a statement for a Missing month turns that cell to Reconciled when the screen is reloaded; a month spanned by two statements together also reads Reconciled, and one covered only in part reads Partial.", "id": "21-1"}, {"phase": "2.1", "title": "Record why a month will never arrive", "why": "A gap I cannot close must be explained once and stay explained, instead of reappearing forever as a fault.", "precondition": "At least one Missing or Partial month for which you genuinely cannot obtain a statement.", "steps": ["On Review > Coverage press 'Review earliest gap', or click the Missing cell itself.", "Choose a 'Reason' -- Not issued, Unobtainable, Unsupported format or Account not in use -- add a 'Note (optional)' if useful, and press 'Acknowledge gap'.", "Read the cell and the 'Acknowledged' and 'Needs review' counts.", "Click the cell again and press 'Remove acknowledgement'."], "expected": "The cell reads Acknowledged and, reopened, shows back the reason and note you gave; Acknowledged rises by one and Needs review falls by one. Removing it returns the cell to Missing or Partial. Reconciled and Outside account life cells cannot be clicked at all.", "also_check": "Acknowledging a month that is in fact already covered by an import is refused with a message and nothing is stored.", "id": "21-2"}, {"phase": "2.1", "title": "Coverage gaps surface where I look for problems", "why": "I will not open a grid every week; the one place I check for trouble has to tell me my history is short.", "precondition": "At least one account or the payslip row with missing or partial months.", "steps": ["Open Workspace > Settings and go to 'Data health'.", "Open the 'Coverage' group.", "Press 'History coverage' and confirm the same account and month in the grid."], "expected": "The Coverage group is marked as needing attention and names each affected row in words -- the account name or Payslips, how many months are missing, how many partial, and the earliest one. When every row is reconciled or acknowledged it reads 'No warnings' with 'Every coverage row is reconciled or acknowledged.'", "also_check": null, "id": "21-3"}, {"phase": "2.2", "title": "Store month-end net worth back to January 2024, with the evidence behind each figure", "why": "A past figure I cannot reproduce is a rumour; I need the price date and the exchange rate that produced it.", "precondition": "Statements and holdings imported as far back as you have them, and any manually valued account given a dated valuation on Accounts. Refresh computes only from what is recorded -- it invents nothing.", "steps": ["Open Build & plan > Wealth and press 'Refresh history'; read the line that follows.", "Read the strip: 'Latest complete month', 'Completeness' and 'Last refreshed'.", "Click a month in the 'Month-end history' table.", "Read that month's positions table, then switch reporting currency in the top bar and read it again.", "Press 'Refresh history' a second time and compare the month totals."], "expected": "'Refreshed N months, M positions.' appears; the table lists every month end from January 2024 to the last completed month; and each account or holding in a month carries its own native value, evidence date, translation rate date and translated value with a status. Both reporting currencies show their own figures for the same months and positions. The second refresh produces identical totals -- nothing drifts.", "also_check": "Recording or correcting an investment event does not change stored history until you refresh: those screens say so with 'Refresh Wealth to bring history up to date.'", "id": "22-1"}, {"phase": "2.2", "title": "An incomplete month says so, and says which position is missing", "why": "A month quietly totalled with a missing price would look like a real fall or rise in my wealth.", "precondition": "At least one month where a holding has no price on or before the month end, an account has no dated valuation, or an exchange rate is missing -- and wealth history refreshed.", "steps": ["Open Build & plan > Wealth and read the 'Coverage' column of the month table.", "Press 'Review incomplete month | <date>'.", "Read the 'Status' column of that month's positions.", "Follow one status link and confirm it lands on the screen where the gap can be filled."], "expected": "The month reads 'Incomplete month' with a short line naming its causes -- for example 'Missing price: 2, No valuation: 1' -- and its Net worth cell reads 'Unavailable | incomplete' instead of a total. In the positions table the affected rows read 'Missing price', 'No valuation', 'Missing exchange rate' or 'Before opening' with no value at all, and each such status is a link to Investments, Accounts or the FX settings.", "also_check": "The month-end chart leaves an incomplete month as a gap rather than plotting zero, and says so: 'Incomplete months are gaps, not zero'.", "id": "22-2"}, {"phase": "2.2", "title": "The waterfall explains a month's change, with its residual on show", "why": "If I cannot see what moved my wealth I cannot tell saving from market luck from the exchange rate -- and a hidden residual would hide an outright error.", "precondition": "One complete month with real activity in it -- income, spending, a transfer, an investment purchase or sale, and a holding whose price moved -- with wealth history refreshed.", "steps": ["On Build & plan > Wealth click a month whose Coverage reads 'Complete'.", "Read 'What changed, in <currency>': Opening, Closing and Actual change.", "Read the lines beneath -- Retained income, Investment income, Internal movements and costs, Other external changes, Market movement, Asset revaluation, FX translation -- and Residual.", "Add those lines up yourself and compare with Actual change, then switch reporting currency and repeat."], "expected": "Closing less Opening equals Actual change, and the eight lines plus Residual add exactly to Actual change. Residual is always shown even when it is zero, and for a month with complete evidence it is no more than rounding at the fourth decimal place. Each reporting currency reconciles on its own figures.", "also_check": "A month missing a rate or a position reads 'Attribution is unavailable for <date>.' with its reasons listed by name -- never a waterfall with the gap plugged.", "id": "22-3"}, {"phase": "2.2", "title": "Investment movement stays separate from money I put in", "why": "If a purchase reads as growth, or growth reads as saving, I will judge my own progress wrongly.", "precondition": "A complete month containing a funded investment purchase and a price move on the same holding, with wealth history refreshed.", "steps": ["Open that month's attribution on Build & plan > Wealth.", "Read 'Internal movements and costs' and 'Market movement'.", "Read 'Retained income' and 'Investment income'.", "Open the month's positions table and read that holding's native value and evidence date."], "expected": "The purchase amount sits in 'Internal movements and costs' -- not in market movement and not in retained income -- while the price change on units already held sits in 'Market movement'. A cash distribution appears once, under 'Investment income'; a reinvested distribution appears as market movement rather than as money in. Residual stays at zero.", "also_check": "A manually valued asset's change appears under 'Asset revaluation' only, and a rate move on a balance held all month appears under 'FX translation' only.", "id": "22-4"}, {"phase": "2.3", "title": "See how much of my ledger is actually classified, and by what", "why": "Coverage I cannot see lets unclassified rows pile up and quietly distort every category total I rely on.", "precondition": "Several months of imported and classified transactions.", "steps": ["Open Workspace > Settings and go to 'Rules'.", "Open 'Coverage and analytics' and read 'Classification coverage by source' and 'Classification coverage by confidence'.", "Read 'Rule hits and disagreements' for each of your rules.", "Read 'Top unclassified descriptions'."], "expected": "Coverage is given as counts and percentages by how each row was decided -- set by hand, your rules, known merchants, recurring series, matched history, starter rules, unclassified -- and by confidence band, over history from January 2024. Each rule shows its hits, when it last decided a row, and how many current rows disagree with it, with example rows whose narration is redacted. The unclassified list names up to twenty normalised descriptions with their row counts.", "also_check": "On Review > Classify the 'Sort' control offers 'Largest amount first' as well as 'Most urgent first', and choosing it puts the largest-value groups at the top of the queue.", "id": "23-1"}, {"phase": "2.3", "title": "My own repeated corrections turn into one narrow suggested rule", "why": "Correcting the same merchant every month is wasted effort, but a rule wider than my corrections would mislabel rows I never checked.", "precondition": "The same kind of transaction corrected by hand at least three times, for a merchant no existing rule already decides.", "steps": ["Correct the same kind of row by hand three or more times, from Money > Transactions or Review > Classify.", "Open Workspace > Settings > 'Rules' and read 'Suggested rules'.", "Read one suggestion's description and its counts.", "Press 'Create rule', then check your rules list and re-check the rows the suggestion named."], "expected": "The suggestion reads 'narration contains \"...\", <direction> -> <category>' with 'N corrections | M affected | K unclassified', where N is the number of your own corrections behind it and M equals what that rule's own preview reports. Creating the rule adds it to your rules and changes no existing transaction; the panel states it is derived only from your corrections and that nothing is created or applied automatically.", "also_check": "No suggestion appears for a pattern an active rule already decides, or for one with fewer than three of your own corrections; the panel then reads 'No suggestions yet -- repeated corrections will appear here.'", "id": "23-2"}, {"phase": "2.3", "title": "Apply a new rule to past rows only after seeing exactly what changes", "why": "A retroactive pass over months of history could overwrite decisions I made by hand, and it cannot be undone.", "precondition": "A rule just created from a suggestion, and unclassified rows in your history that it would match.", "steps": ["On Workspace > Settings > 'Rules' > 'Suggested rules', press 'Check past rows' on that rule.", "Read the count and the sample rows listed.", "Press 'Apply N changes'.", "Spot-check a row you had classified by hand for the same merchant, and a row that had been unclassified."], "expected": "The check reports 'X of Y unclassified rows would change. Checking changes nothing; nothing is applied until confirmed.' with sample rows. Applying then reports 'X of Y unclassified rows updated.' Rows set by hand, confirmed transfer legs and rows already decided another way are untouched -- only rows still unclassified change.", "also_check": "There is no undo for this pass and the screen does not offer one: anything you want reversed afterwards must be corrected row by row. Accept this case only if that scope is what you want.", "id": "23-3"}, {"phase": "2.4"
