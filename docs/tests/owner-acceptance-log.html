, "title": "One place tells me whether my data is trustworthy today", "why": "The problems I am not told about are the ones that cost me; coverage, reconciliation, investment and history gaps need to be named in one view.", "precondition": "Your real ledger in its normal state.", "steps": ["Open Workspace > Settings and go to 'Data health'.", "Read each group's heading and its 'N needs attention' or 'No warnings' chip: Backups, Account identities, Investments, Coverage, Wealth history.", "Open every group carrying a warning and read its findings.", "Use 'History coverage' and 'Investment reviews' to reach the screen behind a finding."], "expected": "Every group is listed with plain-English findings. Warnings name the thing and its probable cause -- how many investment import reviews block committing, how many holdings are unvalued or stale-priced, how many purchases have no funding link, which coverage rows are missing months and from when, and how many months of wealth history are incomplete with the latest one. The two buttons land on the screen where the finding can actually be acted on.", "also_check": "Be aware of a known limit before accepting: the 'Wealth history' group reports incomplete months only. It does NOT flag a complete month whose attribution residual is non-zero, so to accept Phase 2.2 you must read the Residual line yourself on Wealth, month by month.", "id": "24-1"}, {"phase": "2.4", "title": "My backup is recent and complete, and I am told when it is not", "why": "A backup I merely assume exists is the most expensive assumption in the whole system.", "precondition": "A backup run taken on the real stack. The backup itself runs outside the app -- the daily backup service or the backup script -- not from a screen.", "steps": ["Take a backup on the real stack so a database dump, a documents archive and a manifest are written under one stamp.", "Open Workspace > Settings > 'Data health' and open 'Backups'.", "Read the first finding.", "Read the same finding again after two days with no backup taken."], "expected": "The finding names when the newest backup was taken and how many transactions have been added since, marked as satisfied. A run missing its documents archive or manifest is called out as incomplete; nothing older than two days is reported as satisfied; and with no backup at all it says so together with how many transactions no backup holds. The screen never asks for, and never needs, the backup passphrase.", "also_check": null, "id": "24-2"}, {"phase": "2.4", "title": "A restore has actually been proven, not assumed", "why": "An unrestorable backup is not a backup, and a restore must never be allowed anywhere near the working ledger.", "precondition": "A backup stamp with all three files, and the restore drill run by hand against the isolated test database. The drill runs from the command line, not from a screen.", "steps": ["Run the restore drill against the newest backup stamp on the real stack.", "Open Workspace > Settings > 'Data health' and open 'Backups'.", "Read the second finding.", "Tamper with a copy of a backup file, run the drill against that copy, and read the finding again."], "expected": "The finding reads that the newest restore drill passed, with its date, marked as satisfied. It becomes a warning when no drill has ever been run, when the newest one failed, or when it last passed more than a month ago. The drill restores into a temporary database and document directory, refuses to touch the working ledger, and the tampered copy produces a failed drill which the screen then reports as failed.", "also_check": "The drill result shown on screen contains only pass/fail per item and dates -- no row content, filename, identifier or amount from the backup.", "id": "24-3"}, {"phase": "3.1", "title": "A bill I actually paid clears once and moves to next month", "why": "If settling a bill did not clear it, the forecast would keep subtracting money I have already paid.", "precondition": "One monthly commitment on a bank account whose next due date has passed or is close, and an imported bank payment on that same account, in the same currency and the same direction (money out), dated within 45 days of that due date.", "steps": ["Open Plans from the sidebar (Build & plan > Plans) and jump to Commitments with the Commitments link in the \"Plan sections\" bar.", "Note that commitment's status, \"Next due\", \"Paid\" and \"Remaining\" figures, then press Settle.", "Under \"Payment candidates\" find the bank payment, press Select, then press \"Record full payment\".", "Read the confirmation, then look at the same commitment row again and at the Forecast section."], "expected": "The panel says \"Payment recorded; occurrence closed.\"; the commitment's next due date moves on by exactly one month (or the status reads Finished if the schedule ended) and \"Paid\" is back to zero for the new occurrence; in Forecast the occurrence on the old due date is gone from that account and appears nowhere else, and the account's 30/60/90-day balances rise by exactly that amount and no more.", "also_check": "Press Settle again, open History and press Undo on the payment just recorded: the occurrence returns to its old due date and the forecast shows it again. Undo is offered only on the most recent entry.", "id": "31-1"}, {"phase": "3.1", "title": "A part payment leaves exactly the right remainder", "why": "If a part payment cleared the whole bill, I would plan around money I still owe.", "precondition": "One commitment with an open occurrence, and an imported payment on the same account, same currency and same direction, for less than the full amount.", "steps": ["Open Plans > Commitments and press Settle on that commitment.", "Under \"Payment candidates\" press Select on the smaller payment, then press \"Record part payment\".", "Read the commitment row, then open the Forecast section and find that account's occurrence on the due date.", "Open \"Forecast assumptions and exclusions\" at the bottom of Forecast."], "expected": "The panel says \"Part payment recorded.\"; the row shows Partly paid with \"Paid\" equal to the payment and \"Remaining\" equal to the exact difference; the occurrence stays on its original due date but the forecast projects only the remaining amount, and the assumptions list states that a part-paid occurrence projects its remainder.", "also_check": "Trying to use that same bank payment to settle a second commitment is refused (\"this posting already settles a commitment\") and nothing is recorded.", "id": "31-2"}, {"phase": "3.1", "title": "Skipping an occurrence records why, and next month still comes", "why": "A skipped month must not quietly cancel the whole obligation, and I want to remember why I skipped it.", "precondition": "One monthly or annual commitment with an open occurrence I have decided not to pay this time.", "steps": ["Open Plans > Commitments and press Settle on that commitment.", "Press Dismiss, type the reason in the Reason field, and press \"Confirm dismissal\".", "Press Settle (or History) again and read the History list.", "Open the Forecast section and look at that account."], "expected": "The panel says \"Dismissed.\"; History shows the due date with \"Dismissed: <my reason>\"; that occurrence no longer appears anywhere in Forecast; the next scheduled occurrence has become the commitment's \"Next due\" and is projected normally.", "also_check": "\"Confirm dismissal\" stays disabled until a reason is typed, so no occurrence can be dismissed without one.", "id": "31-3"}, {"phase": "3.1", "title": "A card statement due becomes one planned payment and then clears", "why": "A card bill I have not planned is invisible money going out; and it must never be counted twice.", "precondition": "An imported credit-card statement with an amount outstanding, a due date no more than seven days in the past, not marked paid in full; plus an active bank account in the card's currency. Ideally the bank-side card payment has also been imported.", "steps": ["Open Plans and read the \"Needs attention\" section at the top; find the item \"Card payment due\" with the card's name.", "Press \"Plan payment\" and check the form that opens (\"Plan the card payment\"): the paying Account, Amount, Cadence One-off and First date are pre-filled from the statement. Adjust the amount if I am paying less than the full balance, then press \"Create plan\".", "Return to \"Needs attention\" and to Forecast > \"Card statements with no planned payment\".", "Once the bank card payment is in the ledger, press Settle on the item, Select that payment and press \"Record full payment\"."], "expected": "The card item is replaced by a single commitment item for the same payment (never both at once), the statement disappears from \"Card statements with no planned payment\", and after linking the bank-side payment the item leaves \"Needs attention\" and the commitment reads Finished.", "also_check": "Trying \"Plan payment\" a second time on the same statement is refused (\"a payment is already planned for this card statement\"), and choosing the card's own account as the payer is refused.", "id": "31-4"}, {"phase": "3.1", "title": "My own follow-ups, snoozing, and the count on Overview", "why": "This list is the one place I look to know what needs doing; a wrong count or a note I cannot park makes me stop trusting it.", "precondition": "None.", "steps": ["Open Plans > \"Needs attention\", use \"Add a follow-up\" to enter a Title and optional Due date and Account, then press \"Add follow-up\".", "On that item press Snooze, pick tomorrow's date, and press \"Confirm snooze\"; then press \"Show snoozed\" and press Wake.", "Press Complete on the item, then press \"Show recently resolved follow-ups\" and press Reopen.", "Open Overview (Money > Overview) and read the \"Needs attention\" panel."], "expected": "Each action moves the item immediately: a snoozed item leaves the main list and sits under \"Show snoozed\" until woken or until its date passes; completing moves it to recently resolved and Reopen brings it back. On Overview the \"Needs attention (n)\" count equals the number of items in the Plans list and the first five items are the same items in the same order.", "also_check": "Commitment and card items can be dismissed with a reason, but goal, reserve, renewal, maturity, deadline and review items offer only Snooze - there is deliberately no Dismiss on those.", "id": "31-5"}, {"phase": "3.2", "title": "The worst point of the next 90 days, and how much of it is only assumed", "why": "A forecast that mixes what I know with what I guessed would make me act on a number that is not real.", "precondition": "At least two active accounts with recently imported balances, in both currencies, and several commitments of which at least one was entered with Certainty \"Estimated\".", "steps": ["Open Plans and jump to Forecast with the Forecast link in the \"Plan sections\" bar.", "Read the \"By currency\" block for each currency, then the \"By account\" block for each account.", "Find the occurrences listed under an account and look for the ones marked estimated."], "expected": "Every currency and every account shows its 30d/60d/90d balance with a \"confirmed\" figure beside each, and a line reading \"Lowest <amount> on <date> - confirmed lowest <amount> on <date>\"; no figure mixes the two currencies and no exchange rate is applied in this section; each estimated occurrence is labelled estimated. The section header says \"Read-only - 30 / 60 / 90 days\" and reloading gives identical numbers.", "also_check": "\"By currency\" covers only liquid asset accounts and credit cards, and names which accounts of that currency are excluded or stale rather than quietly dropping them.", "id": "32-1"}, {"phase": "3.2", "title": "A shortage shows up in the account that has to pay it", "why": "Money in another account does not pay a bill in this one; and I never want the app moving money on my behalf.", "precondition": "One bank account whose projected balance goes below zero within 90 days (a commitment larger than its balance before the next salary arrives), plus a second account in the same currency that holds enough to cover it.", "steps": ["Open Plans > Forecast > \"By account\" and find the account that runs short.", "Read the Shortfall callout and the \"Could be funded from\" line.", "Check the second account's own figures and then check Transactions for that account."], "expected": "The account shows \"Shortfall of <amount> on <date>\" with the amount equal to how far below zero it goes and the date of that low point, followed by \"Could be funded from <account name> (<its lowest balance>). Nothing is moved automatically.\"; the other account's figures are unchanged and no transfer, posting or planned movement has been created anywhere.", "also_check": "When no single other account in that currency could cover it, the callout reads \"No other account in this currency could cover it on its own.\" A credit card never shows a shortfall.", "id": "32-2"}, {"phase": "3.2", "title": "A planned card payment is counted once, not twice", "why": "If paying the card only showed money leaving the bank, my total would look smaller than it really is.", "precondition": "A card payment planned from a card statement (see the card-due case), whose payment date is later than the card account's own imported balance date.", "steps": ["Open Plans > Forecast > \"By account\" and find the paying bank account and the card account.", "Compare the occurrence on the paying account with the entry on the card account for the same date.", "Read the \"By currency\" totals for that currency, before and after planning the payment."], "expected": "The paying account shows the payment going out on that date and the card account shows an entry labelled \"card settlement\" for the same amount coming back on the same date, so the currency's 30/60/90-day totals are unchanged by that pair; the assumptions list says a planned card payment reduces the card's balance on the same date.", "also_check": "If the card's own balance date is already on or after the payment date, no mirror appears on the card and the commitment is listed under \"Commitments not applied\" with the reason that its card settlement is not projected - the bank side is still projected.", "id": "32-3"}, {"phase": "3.2", "title": "The forecast tells me what it could not project", "why": "A gap I cannot see is worse than a gap I can: a silent zero would read as good news.", "precondition": "At least one account excluded from the forecast or with a balance more than 35 days old; one commitment occurrence dated before its account's balance date that was never settled; one card statement with an amount due and no planned payment.", "steps": ["Open Plans > Forecast and read the badges on each account in \"By account\".", "Read the \"Not projected\" list under an account, then \"Accounts not forecast\", \"Commitments not applied\" and \"Card statements with no planned payment\".", "Open \"Forecast assumptions and exclusions\".", "Press Settle on one entry under \"Not projected\" and record or dismiss it."], "expected": "A stale account carries \"Stale balance - <n> days old\" and an account with statement holes carries \"<n> coverage gap months\"; the unsettled occurrence appears under \"Not projected\" with a Settle button and is not silently added into the balance; excluded accounts and unprojected commitments are each named with a plain-English reason; the unplanned card due is listed with a \"Plan payment\" button; the assumptions list states each of these in a sentence. After settling, the entry disappears from \"Not projected\".", "also_check": "Nothing in these lists is shown as zero, averaged or converted to another currency to fill the hole.", "id": "32-4"}, {"phase": "3.2", "title": "Closing off a month and being able to reopen it", "why": "The monthly walk-through is how I keep the ledger honest; I need to see what is still outstanding and to reopen a month I closed too early.", "precondition": "At least one complete past calendar month of imported statements. For the Position step, Wealth history must already be refreshed for that month and the month before it.", "steps": ["Open Plans and jump to Review with the Review link in the \"Plan sections\" bar; check the Month field shows last month, or pick a month.", "Follow each step's link in turn - Coverage, Transfers, Categories, Position, Commitments - and deal with what each one shows.", "Come back to Review and press \"Mark review complete\"; reload the page and check Overview's \"Needs attention\" panel.", "Press \"Reopen review\" and check Overview again."], "expected": "Each of the steps shows its own count next to a link that opens the screen where that work is done; after completing, the section reads \"Review complete since <date> - <n> actions remaining.\" and Overview says last month's review is complete with that date; Reopen removes the completion and Overview says it is not yet complete. Choosing a month in the future is refused with the app's own message.", "also_check": "If Wealth history has not been refreshed for that month, Position reads \"Not yet refreshed for this month.\" with a Refresh link rather than showing an invented total, and the month-on-month change appears only when both months are stored. On a single month the coverage step's gap-cell and row counts read the same number.", "id": "32-5"}, {"phase": "3.3", "title": "The same money can never be earmarked twice", "why": "If one account's balance could back two goals at once, I would believe I can afford both.", "precondition": "One active asset account with a known current value, and two active goals (plus the emergency reserve set up, to try the second purpose).", "steps": ["Open Plans and jump to Goals; on the first goal press Reserve, pick the account, choose \"An amount\", enter most of the account's value and press Reserve.", "Read the Resources table's Value, Reserved and Unreserved columns for that account, and note net worth on Overview.", "On the second goal press Reserve, pick the same account and ask for more than what is left unreserved.", "Back on the first goal, press Release on that reservation and read the Resources table and Overview net worth again."], "expected": "The first reservation is listed under its goal with its date and amount and the account's Unreserved falls by exactly that amount; the second request is refused with \"this reservation is more than the account's unreserved value\" and nothing is recorded; Release frees exactly the released amount back into Unreserved and keeps the released reservation visible in the history; net worth on Overview and Wealth is identical at every step - reserving and releasing move no money.", "also_check": "Reserving \"The whole account\" refuses any further reservation on it with \"this account is already reserved\", and an account that already carries an amount reservation cannot be reserved whole. Reserving the same account for the emergency reserve is possible only up to what is still unreserved.", "id": "33-1"}, {"phase": "3.3", "title": "A goal shows what I put in, apart from what the market and the rate did", "why": "A goal that grew because the rupee moved is not a goal I have funded; treating it as progress would make me save less than I need to.", "precondition": "A goal in one of my reporting currencies with a reservation on an account held in the other currency, or on an account valued from holdings; enough recorded rates or prices for the value to have moved since the reservation was made.", "steps": ["Open Plans > Goals and read the goal's progress lines.", "Read the reservation line underneath it (its original amount and \"Now\").", "Read the Resources table at the bottom of the section and the note below it."], "expected": "One line reads \"Current <amount> (<n>%) - Contributed <amount> - Market <amount> - FX <amount>\", where Contributed is only what was actually put in and price and exchange-rate movement are shown separately; the reservation keeps its original amount in the account's own currency and shows its present value in the goal's currency; where a value or rate is missing the goal says \"Progress unavailable - a value or exchange rate is unavailable\" instead of a guess, and the note states that a snapshot account's change counts as valuation movement, not a contribution.", "also_check": "The shortfall line prints both \"Shortfall\" and \"Surplus\" with one of them zero - accept it only if the non-zero figure is the right one for this goal. \"Mark achieved\" and Abandon both ask to confirm and release the goal's reservations in the same step.", "id": "33-2"}, {"phase": "3.3", "title": "How many months the emergency reserve really covers, and on what spending", "why": "A months-of-coverage number built on a spending figure I cannot see is not something I would act on in a crisis.", "precondition": "Several months of imported and largely categorised statements, and at least one asset account I would genuinely draw on in an emergency.", "steps": ["Open Plans and jump to Reserve; press \"Set up the reserve\", set Target months, Baseline method \"Reference period\", Reference months, tick only the buckets that are truly essential, and press \"Save settings\".", "Under \"Mark as emergency resource\" press \"Mark an account eligible\", pick the account, set Access days and any Restriction note, and save.", "Press \"Reserve for emergencies\" on that account for part of its value.", "Read the Baseline line, the Coverage line, the per-currency list, and the eligible account's own row."], "expected": "The Baseline line names its own monthly amount, the exact period it was read from and how much uncategorised spending it left out; Coverage reads \"<n> months of coverage - Target <amount> - Gap <amount> - Reserved <n> months\"; each currency's eligible amount is listed with the rate and rate date used; the account row shows \"Reserved for goals\" separately from \"Reserved for emergencies\" and its Eligible amount excludes anything already reserved for a goal; the assumptions sentence states that a goal-reserved resource is not counted, that commitments due within 30 days are shown but not subtracted, and that a reservation moves no money.", "also_check": "With no essential spending in the period the Baseline reads \"not enough information\" and Coverage reads \"Coverage: not enough information\" - never an unlimited or blank number of months. If the reference period has statement holes, a sentence says the baseline may be understated. Removing an account while an emergency reservation on it is active is refused.", "id": "33-3"}, {"phase": "3.3", "title": "A goal falling behind and a thin reserve ask for my attention", "why": "A goal I quietly miss is the whole point of having goals; I want it raised, but I do not want to be able to make it go away without fixing it.", "precondition": "One active goal whose current earmarked value is behind what its target and date require, and an emergency reserve configured with coverage below its target months.", "steps": ["Open Plans > \"Needs attention\" and look for \"Goal shortfall\" and \"Reserve below target\".", "Press Snooze on one of them, pick a date a few days out, and press \"Confirm snooze\"; then press \"Show snoozed\".", "Increase the reservation behind the goal until its shortfall is gone, and reload Plans."], "expected": "\"Goal shortfall - <goal name>\" appears with the goal's target date and shortfall amount, and \"Reserve below target\" appears with the gap amount; both offer only Snooze and no Dismiss; a snoozed item moves under \"Show snoozed\" and returns on its own once the date passes; once the shortfall is actually closed the item disappears with no further action from me.", "also_check": "Neither item can be dismissed with a reason - the only way to clear it is to fix the shortfall or snooze it.", "id": "33-4"}, {"phase": "3.4", "title": "A renewal is raised once, and confirming it keeps next year's", "why": "A policy that lapses because nobody told me, or that keeps nagging after I renewed, are both failures.", "precondition": "One insurance policy of mine whose renewal date is within the next 30 days.", "steps": ["Open Plans, jump to Register, choose Kind \"Insurance policy\" under \"Add a record\", fill Title, Counterparty, Covered, Renewal date, Premium amount, Premium cadence and Currency, and press \"Add record\".", "Go to \"Needs attention\" and find \"Renewal due\" with that title.", "Press Renewed, enter next year's renewal date and press \"Confirm renewal\".", "Read \"Needs attention\" again and read the record in Register."], "expected": "Exactly one \"Renewal due\" item appears for that policy with its renewal date (highlighted if already past); after confirming, the item disappears, the record reads \"Renews <the new date>\", and no duplicate item is left behind. When the new date comes within 30 days the item returns.", "also_check": "The \"Add a record\" form warns \"Do not record identity numbers or credentials here.\" A nominee record or an administration deadline offers no money-planning action at all; an administration deadline is instead closed with Complete and can be reopened.", "id": "34-1"}, {"phase": "3.4", "title": "My policy PDF lives with its record and opens from there", "why": "At claim time I need the document in seconds, from the record it belongs to - not by hunting through files.", "precondition": "One PDF on my machine (a policy schedule or deposit certificate), under 20 MB, plus the matching record in the Register.", "steps": ["Open Plans > Register, find the record and press \"Attach document\".", "Under \"Or upload a new PDF:\" choose the Type, type a Title, choose the File, and press \"Upload and attach\".", "Click the document's title on the record to open it.", "Press Detach, then attach it again through \"Attach from the library\" and \"Choose a document\"; then open Documents (Review > Documents)."], "expected": "The record lists the document by the title I typed; clicking it opens the original PDF in a new tab; Detach removes only the link and the document is still in the library to attach again; the Documents screen lists it with its title and no import link. Uploading the same PDF again does not create a second copy.", "also_check": "A file that is not a PDF, or one that is too large, is refused with a clear message and nothing is attached to the record.", "id": "34-2"}, {"phase": "3.4", "title": "A part-paid claim shows the right amount still outstanding, and adds no income", "why": "A reimbursement is my own money coming back; counting it as new income would inflate what I think I earn and hide what the insurer still owes me.", "precondition": "One claim record with an expected amount and currency, a receiving bank account in that currency, and an imported credit on that account for part of the claim, classified as a refund or transfer rather than income.", "steps": ["Open Plans > Register > Claims, press \"Expect reimbursement\" on the claim, check the pre-filled form and press \"Create plan\".", "On the record press Settle, press Select on the part reimbursement, and press \"Record part payment\".", "Read the record's planned line.", "Check the month's income figure on Overview and on Spending before and after."], "expected": "The record reads \"... - Expected <full claim> - Received <what arrived> - Outstanding <the exact difference>\" with an open occurrence for the remainder; the month's income figure is byte-for-byte what it was before recording the reimbursement.", "also_check": "If the credit is still classified as income the panel refuses it and explains that a reimbursement or returned principal is never counted as newly earned income, with a link to recategorise the transaction as a refund or transfer first.", "id": "34-3"}, {"phase": "3.4", "title": "A deposit maturing soon asks me to plan its proceeds, then settles against the real transfer", "why": "Maturing money that is not in the forecast is money I do not plan with - and once it lands it must not be counted twice.", "precondition": "One fixed or recurring deposit account, a deposit record with its expected proceeds, currency and maturity date within the next 30 days, and a receiving asset account in the same currency. Ideally the maturity transfer is already imported.", "steps": ["Open Plans > \"Needs attention\" and find \"Maturity due\" for that deposit.", "Go to Register > Deposits, press \"Plan proceeds\", choose the receiving account and press \"Create plan\".", "Return to \"Needs attention\" and to Forecast for the receiving account.", "Press Settle on the record, Select the incoming leg of the maturity transfer, and press \"Record full payment\"."], "expected": "\"Maturity due\" disappears from \"Needs attention\" as soon as the proceeds are planned; the record shows the planned amount, its status and next due date, and the receiving account's forecast shows the proceeds once; after linking the transfer leg the commitment reads Finished and the proceeds are no longer projected on top of the balance that now holds them.", "also_check": "Choosing the deposit account itself as the receiving account is refused (\"choose the account that receives the proceeds\"), and planning money a second time for the same record is refused (\"money is already planned for this record\").", "id": "34-4"}, {"phase": "3.4", "title": "A record I have not looked at for a year asks to be reviewed", "why": "Cover, nominees and deposit terms go stale quietly; an annual nudge is the only thing that catches it.", "precondition": "A policy, deposit or nominee record created, or last reviewed, more than a year ago.", "steps": ["Open Plans > \"Needs attention\" and find \"Review due\" with that record's title.", "Press \"Mark reviewed\".", "Open Register and read that record; also look at a record added today and at an archived record."], "expected": "The item disappears and the record reads \"Reviewed <today>\" and no longer shows \"Review due\"; a record added today does not ask for review, and an archived record never asks.", "also_check": "\"Mark reviewed\" is offered only on policies, deposits and nominee records - claims and administration deadlines are closed with Complete instead, so those never carry a review date. A deposit whose account has been closed can only be archived, not edited.", "id": "34-5"}, {"phase": "4.1", "title": "This month's spending is readable by category and by bucket, down to the rows behind it", "why": "One monthly total tells me nothing about what to change; and a total I cannot open is a total I cannot trust.", "precondition": "At least one month of imported and largely categorised statements.", "steps": ["Open Spending (Money > Spending), set Range type to Month and pick the month.", "Read the \"Spending summary\" tiles, then the \"By bucket\" table and chart, then the \"By category\" table, including the note above \"By bucket\".", "Click the number in the Transactions column on one category row.", "Go back and press \"Download CSV\", then open the file."], "expected": "Bucket and category rows reconcile against the summary, and the note explains that buckets cover categorised spending only so bucket rows can total less than the summary; clicking a category's count opens Transactions filtered to exactly that category and date range and shows the rows behind the figure; the CSV holds those same rows with date, account, description, category, bucket, exact amount, currency and base amount, and its totals match the screen. Transfers, card payments and investment legs are excluded, as the \"What counts as spending\" note states.", "also_check": "A category where refunds exceeded spending shows a \"Net refund\" label with a negative figure (a refund lowers spending rather than becoming income), and spending with no category is its own row, never folded into a bucket. A very large range says in the file that it was truncated rather than silently cutting rows.", "id": "41-1"}, {"phase": "4.1", "title": "A budget for the few categories that matter, with an exact variance", "why": "A budget that quietly counts the same spending under both a category and its bucket would tell me I am overspending twice.", "precondition": "A current or recent month with imported spending, and one category whose parent bucket also carries spending.", "steps": ["Open Spending, pick the month, and scroll to the Budget panel.", "Under \"Set a budget\" choose Scope Category, pick the category, enter an Amount and press \"Add budget\".", "Repeat with Scope Bucket for the bucket that contains that category.", "Read the table's Scope, Budgeted, Actual, Available and Variance columns, then check Transactions and the account balances are unchanged."], "expected": "Each line shows its scope with Budgeted, Actual, Available and Variance, and Variance is positive when I am under budget; the bucket line's Scope cell reads \"- excludes <the category>\" and its Actual leaves that category's spending out, so nothing is counted twice; the panel states that a budget is an assumption that never changes the ledger, and no transaction or balance has moved.", "also_check": "\"Copy last month\" brings last month's lines forward and reports how many were copied and how many already had a budget this month; Remove asks to confirm and says it does not touch the ledger.", "id": "41-2"}, {"phase": "4.1", "title": "An unspent budget carries forward, and says how far back it looked", "why": "If last month's leftover vanished, or a stale carry lingered after I edited an old month, the budget would be fiction.", "precondition": "A budget line in the previous month with spending under (or over) it.", "steps": ["Open Spending, set the Month to the previous month, and add a budget line with \"Carry the unspent or overspent remainder into next month\" ticked.", "Set the Month to this month and add the same scope again with the checkbox ticked.", "Read that line's Scope cell and its Available and Variance columns.", "Go back, change the previous month's budget amount, then return to this month and read the line again."], "expected": "This month's line reads \"- carried <amount> over <n> month(s)\" with a plain reason in brackets, Available equals the budget plus that carry, and Variance is budget plus carry less actual; after editing the older month, this month's carry has changed to match - no stale figure survives.", "also_check": "The bracketed reason names where the chain stopped: \"the earlier line does not carry forward\" when the earlier month's line had rollover off, and \"carry stops after twelve months\" at the limit.", "id": "41-3"}, {"phase": "4.1", "title": "My subscriptions are found for me, in the currency I actually pay", "why": "I should not have to confirm each one; and a rupee subscription reported in dirhams at today's rate is a number I cannot check against the charge.", "precondition": "Enough imported history for at least three charges of the same subscription - typically three or more months of statements across the cards and accounts I pay from.", "steps": ["Open Subscriptions (Money > Subscriptions) and let \"Checking for subscriptions...\" finish.", "Read \"Next renewal\", then the \"Monthly equivalent\", \"Annual spend\" and \"Current\" tiles.", "With the view set to Current, read the table: Subscription, Cadence, Payment source, Status, Renewal and Amount.", "Open \"How subscriptions are identified\", then read the \"By card\" table at the bottom."], "expected": "The subscriptions I recognise are listed with no confirmation step anywhere; each shows its own amount in its own currency with its cadence, and the monthly and annual figures in the base currency are described as estimates built from the latest charges; Payment source names the card or account each is paid from, masked; the \"By card\" table shows each payment source with how many subscriptions and what monthly cost depends on it - so I can see what breaks if a card is replaced.", "also_check": "A series whose label is still a raw billing descriptor is tagged \"Needs a name\"; Rename in its actions menu replaces it everywhere and the name survives the next import, a cancel and a resume. Two services billed through one descriptor at the same time appear as two rows I can name apart, while two amounts on one descriptor at different times stay a single subscription with a price change.", "id": "41-4"}, {"phase": "4.1", "title": "\"Not a subscription\" is final and survives the next import", "why": "This is my one correction to an automatic guess; if a later import undid it, I would have to fight the app every month.", "precondition": "One discovered series shown on Subscriptions that is not really a subscription (rent, a loan instalment, a utility), and a further statement covering later charges of the same payment, ready to import.", "steps": ["Open Subscriptions, open the row's actions menu (\"Manage <label>\") and press \"Not a subscription\".", "Open Recurring (Money > Recurring) and find the payment under \"Active payments\".", "Import the further statement (Review > Import) and let it commit.", "Return to both Subscriptions and Recurring."], "expected": "The series disappears from Subscriptions at once and appears on Recurring, and after the new import it is still on Recurring and has not returned to Subscriptions - the later charges joined the same payment rather than creating a new subscription.", "also_check": "On Recurring the same menu offers \"A subscription\" if I was wrong, and that choice sticks through imports too. Remove is a different, stronger action: its confirmation says it stops tracking the payment and that it will not come back on its own - after removing and importing again, it is absent from both screens.", "id": "41-5"}, {"phase": "4.1", "title": "Cancelling and restarting the same subscription keeps one history", "why": "I stop and restart services; I want one record with its whole story, not a new row each time that loses my name and my corrections.", "precondition": "One current subscription with several charges behind it.", "steps": ["Open Subscriptions, open the row's actions menu, press Cancel and then \"Confirm cancel\".", "Switch the view to Past and confirm it is there.", "Click the subscription's name to open its own page and read \"Billing periods\" and the charges listed as \"Ledger evidence\".", "Press Resume, reload, and read \"Billing periods\" again."], "expected": "Cancelling closes the current billing period on a date no earlier than its last charge and moves the row to Past; the page keeps every period it was ever active with that period's charge count, spend and links to the ledger rows; Resume opens a new period on the same subscription, so its name, its \"not a subscription\" choice and its whole price and charge history stay with it.", "also_check": "A subscription that simply stopped being charged shows as ended on its own without me cancelling it; a charge imported late that was in fact on time restores the same period rather than showing a false restart; a subscription set to Paused leaves the totals but is not ended.", "id": "41-6"}, {"phase": "4.1", "title": "A price rise is put in front of me with both amounts and both dates", "why": "Quiet price creep is exactly what I want this screen to catch, and I need the old and new figures to decide whether to keep it.", "precondition": "One subscription whose latest charge differs from the previous charge in the same currency.", "steps": ["Open Subscriptions and read the detail line under the \"Annual spend\" tile.", "Open that subscription's page and read the \"Price changed\" row and the \"Price history\" list.", "Check the same payment on Recurring by expanding \"Review <label>\" and reading its \"Price change\" line."], "expected": "The page shows \"Price changed - From <old amount> to <new amount> on <date>\", and \"Price history\" lists each observed amount with its date, collapsed where the price did not move; the subscription's own amount and its monthly and annual figures already follow the new price with no accept step for me to perform.", "also_check": "The Subscriptions list itself shows only a count of price changes in the last 90 days - accept this only if that count matches the subscriptions that actually changed and each one's own page shows the right amounts.", "id": "41-7"}, {"phase": "4.1", "title": "A yearly plan I have only been charged for once", "why": "An annual subscription cannot be detected from a single charge, but it is often the most expensive one I have.", "precondition": "One imported charge for an annual subscription that appears only once in my history.", "steps": ["Open Transactions (Money > Transactions) and find that charge.", "Press \"Add as subscription\", set the Name and choose Cadence Annual (or Custom with the days between charges), and press \"Add as subscription\".", "Open Subscriptions and find it, then open its own page."], "expected": "It is listed with its annual amount in its own currency, a monthly equivalent computed from it, and a next expected date one year after that charge, and it counts in \"Annual spend\" and in the Current total.", "also_check": "Repeating the same action on the same charge does not create a second subscription. Optionally set its Payment channel (for example an app store or a wallet autopay) on its page and check it persists - the channels are a list I can extend, not a fixed set.", "id": "41-8"}, {"phase": "4.2", "title": "Each year's compensation and net pay agree with my payslips", "why": "If these totals disagree with the payslips themselves, every conclusion I draw about my pay is wrong.", "precondition": "My real payslips recorded for at least one full year, in each currency I am paid in.", "steps": ["Open Salary (Build & plan > Salary) and, if more than one currency appears, pick one in the \"Analysis currency\" toggle.", "Read the \"Annual evidence\" table: Compensation, Fixed, Variable, Variable share, Reimbursement, Deductions, Net pay, Cash received.", "Compare each year's Compensation, Deductions and Net pay against the payslips themselves.", "Read the \"Pay periods\" table month by month for the same year."], "expected": "For each year, Compensation plus Reimbursement less Deductions equals Net pay, and every figure matches my own payslips exactly; amounts stay in the payslip's own currency and there is no combined total across currencies anywhere on the screen; no year carries a figure for a period I never recorded.", "also_check": "A month where a bonus arrived on its own separate payslip adds no extra month to \"Payslip months\" - the two payslips are summed into that one month.", "id": "42-1"}, {"phase": "4.2", "title": "Fixed versus variable pay, with my correction overriding the guess", "why": "Whether an allowance counts as fixed pay decides whether my increments and my variable share mean anything.", "precondition": "Payslips with at least one regular allowance, one irregular payment (bonus, arrears or overtime) and one reimbursement line.", "steps": ["Open Salary and read the \"Earning labels\" table: Label, Component, Months, First month, Last month, Latest amount, and which rows are tagged \"Inferred\".", "Change a wrongly classified label with its Component picker (Fixed, Variable or Reimbursement).", "Read \"Annual evidence\" and \"Variable pay\" again.", "Press \"Use inference\" on that label to put it back."], "expected": "Changing a label's component changes every month that carries that label and the yearly Fixed, Variable and Variable share figures at once, and the \"Inferred\" tag for that label is replaced by my own choice; \"Use inference\" restores the automatic guess. A reimbursement label stays out of Compensation while still sitting inside Net pay.", "also_check": "Reimbursement is never guessed for me, so every reimbursement label must be set by hand - check each label that is money repaid to me rather than pay.", "id": "42-2"}, {"phase": "4.2", "title": "A missing payslip month is shown, never filled in", "why": "An averaged or projected month would quietly change my yearly totals and my increment history.", "precondition": "At least one month between my first and last payslip in a currency for which I have no payslip; ideally also one payslip I have since corrected and superseded.", "steps": ["Open Salary and find that month in the \"Pay periods\" table.", "Read the \"Gap months\" column for that year in \"Annual evidence\".", "Check that the superseded payslip's figures appear nowhere in the totals."], "expected": "The missing month appears in the list reading \"No payslip\" with no figures at all, and the year's \"Gap months\" count includes it; no yearly total has been topped up with an average or a projection for that month; the superseded payslip is excluded and its month is not counted twice.", "also_check": "The chart on the screen leaves a gap for that month rather than joining the line straight across it.", "id": "42-3"}, {"phase": "4.2", "title": "Pay earned versus cash that actually reached the bank", "why": "A payslip is a claim; only the bank credit is money. Treating them as the same would hide a payment that never arrived.", "precondition": "Payslips where at least one is linked to its bank credit, one is not linked, and at least one salary credit in my bank has no payslip at all.", "steps": ["Open Salary and read \"Latest evidenced pay period\" with its \"Earned net pay\" and \"Cash received\" tiles.", "Read the Status column in the \"Pay periods\" table for the linked, unlinked and stale-link months.", "Read the banner at the top of the section, and press \"Review credits\" if it appears.", "Read \"Salary credits without a payslip\" and click one credit's date."], "expected": "Cash received is filled only where a payslip's linked bank credit is still eligible; an unlinked payslip reads \"Not linked\" and an out-of-date link reads \"Linked, but no longer eligible\", each with no cash figure rather than the net pay repeated; the salary credits with no payslip are listed by date with their account and amount and are never matched to a month on my behalf; clicking a date opens Transactions on that day.", "also_check": "The banner reads \"Salary evidence is reconciled\" only when there are no unmatched credits and no unclassified deductions; otherwise it names the counts and offers the link to review them.", "id": "42-4"}, {"phase": "4.2", "title": "My increment history matches the raises I actually had", "why": "A one-off arrears month read as a pay rise, or a real rise missed, would misstate how my pay has grown.", "precondition": "Payslips spanning at least one pay rise, ideally including one month of arrears or a partial month, and a currency with a gap month.", "steps": ["Open Salary and read the Increments list.", "Check each entry's month, previous and new fixed pay, change and percentage against my own pay history.", "Look at the most recent entry and at any entry that spans a missing month."], "expected": "Every real rise is listed with its month, the previous and new fixed pay, the exact change and the percentage; nothing else is listed - a change the following month reversed (arrears, a partial month) is not shown as an increment; a change in the latest payslip month is tagged \"Unconfirmed\" until a later payslip exists, and a change measured across a missing month is tagged \"After a gap\".", "also_check": "The percentage is blank rather than misleading where the previous fixed pay was zero, and correcting a label's component (fixed versus variable) changes the increment list accordingly.", "id": "42-5"}, {"phase": "4.3", "title": "What each asset class and each account actually returned", "why": "If a class or account return is wrong I could put more money into my worst performer believing it is my best.", "precondition": "At least two holdings in different asset classes, held in at least two investment accounts, each with a recorded purchase and a current price the app accepted.", "steps": ["Open Investments from the Build & plan group in the left sidebar.", "Note the XIRR figure and the Value figure in the strip across the top of the page.", "Scroll to the Analysis section and open Methodology and detailed returns.", "Read the Asset classes table (Class, XIRR, Value) and the Accounts table (Account, XIRR, Value)."], "expected": "Every class and account with complete evidence shows an XIRR percentage and a Value in my base currency. When the top strip says Value (not Valued portion), the Value entries in the Accounts table add up by eye to that same figure, and so do the Value entries in the Asset classes table. Class and account returns differ from each other and sit either side of the portfolio XIRR rather than all repeating it.", "also_check": "A class that holds only one security shows a return I can compare with that holding's own return on its holding page; the two should agree.", "id": "43-1"}, {"phase": "4.3", "title": "A return I cannot trust is refused, not guessed", "why": "A made-up return on a holding with a missing price would be worse than no return at all.", "precondition": "One holding without a current price (or an account held only as a recorded valuation snapshot rather than as units and lots).", "steps": ["Open Investments and read the Valuation confidence figures (Valued, Unvalued, Stale).", "Open Methodology and detailed returns and read the Coverage list at the top.", "Read the XIRR column in the Asset classes and Accounts tables for the group that contains the unpriced holding."], "expected": "The group containing the unpriced holding shows a short plain-English reason in place of a percentage, never 0% and never a blank. Any account held as recorded snapshots is named in the Coverage list with the words excluded from holdings analysis, and does not appear as a row in the Accounts return table.", "also_check": "The Unvalued count in Valuation confidence matches the number of holdings the Holdings table marks as having no supported value.", "id": "43-2"}, {"phase": "4.3", "title": "Money I added is not reported as market gain", "why": "If a month's purchase is counted as growth, I will think the market made me money that I actually paid in myself.", "precondition": "Wealth history refreshed, and at least one complete past month in which I made a purchase of a size I can recognise.", "steps": ["Open Wealth from Build & plan and press Refresh history, then wait for the refreshed confirmation.", "Open Investments, open Methodology and detailed returns and find the Months table.", "Find the row for the month in which I made that purchase and read Contributions, Withdrawals, Income, Charges and Market and FX.", "Read the Years table row for the year containing that month, together with the class rows listed beneath it."], "expected": "The purchase shows up under Contributions for that month, at the amount I paid in my base currency; Market and FX is a separate figure and does not include it. A month in which I took money out shows that amount as a negative Withdrawals figure. In the Years table, the class rows beneath a complete year add up, column by column, to that year's own row.", "also_check": "The month's Dietz percentage is not simply the month's value change divided by the opening value — a month with a large mid-month purchase should differ from that crude figure.", "id": "43-3"}, {"phase": "4.3", "title": "Months without full evidence stay blank, not zero", "why": "A month shown as 0% return would read as a flat month, when the truth is that the app does not know.", "precondition": "At least one month in the stored history where a holding had no accepted month-end value.", "steps": ["Open Investments and look at the Monthly return evidence chart in the Analysis section.", "Open Methodology and detailed returns and read the Months table.", "Read the Years table for the year that contains that month."], "expected": "The incomplete month is labelled Incomplete month with a count of what is missing, and carries no percentages or amounts. In the chart it is a visible gap in the line, not a point at zero. The year containing it says how many months are incomplete and shows no sums for that year at all.", "also_check": "The current, unfinished month is simply absent from the Months table rather than shown as a partial month.", "id": "43-4"}, {"phase": "4.3", "title": "Return history says when it is waiting on a refresh", "why": "Stale month figures presented as current would let me judge a year on numbers that predate my latest holdings.", "precondition": "Investment history that has never been refreshed, or a newly recorded investment event since the last refresh.", "steps": ["Record or correct an investment event on Investments and read the notice that appears after saving.", "Open Methodology and detailed returns and read the Months and Years sections.", "Open Wealth, press Refresh history, then return to Investments and reopen Methodology and detailed returns."], "expected": "Before the refresh the app says in plain words that wealth history has not been refreshed and that month and year figures are empty until a refresh stores them, and the class and account XIRR figures are still shown. After the refresh, month and year rows appear and include the period I just changed.", "also_check": "Recording the event did not silently change any already-shown month figure before I refreshed.", "id": "43-5"}, {"phase": "4.3", "title": "Allocation target and drift against it", "why": "Drift measured against the wrong target would push me to rebalance in the wrong direction.", "precondition": "At least one complete month in the stored history, with holdings in two or more asset classes.", "steps": ["Open Investments, open Methodology and detailed returns and find Allocation target.", "Read whether it says Owner set, Inferred or No target yet, and read the ratios listed per class.", "Type my own ratios for the classes I hold so they add to 1, then press Save target.", "Find the latest complete month in the Months table and read its Allocation cell.", "Press Use inference and read the Allocation target section again."], "expected": "Before I set anything, the ratios are marked Inferred and add up to 1. After Save target the section says Owner set and shows exactly the ratios I typed. In the latest complete month's Allocation cell, each class shows its actual ratio, my target and a drift figure, and drift equals the actual minus the target by eye. Use inference returns the section to Inferred without me retyping anything.", "also_check": "A set of ratios that does not add to 1, or one with far too many decimal places, is refused with a message and leaves the previously saved target in place.", "id": "43-6"}, {"phase": "4.3", "title": "Comparing a period against a tracker I chose", "why": "A benchmark built from invented index values would flatter or damn my portfolio on numbers that never existed.", "precondition": "A security I hold that has accepted dated prices and is reasonable to use as a benchmark, plus at least one complete month of history.", "steps": ["Open Investments, open Methodology and detailed returns and find Benchmarks.", "Choose that security in the Portfolio list.", "Read the Excess column in the Inception, Years and Asset classes tables, and look at the Monthly return evidence chart.", "Set the Portfolio list back to No benchmark and read the Excess column again."], "expected": "With a benchmark chosen, a second dashed line appears in the chart and Excess shows a percentage wherever the app has prices at both ends of the period. Where a price is missing at either end, Excess shows a short reason instead of a number. With No benchmark selected, every Excess entry falls back to a dash or a reason and no comparison is claimed.", "also_check": "Choosing a per-class benchmark changes only that class's Excess figures and leaves the portfolio comparison alone.", "id": "43-7"}, {"phase": "4.4", "title": "Recording who carried a remittance and what they charged", "why": "No statement I receive itemises the provider or the fee, so if I cannot record them the cost comparison can never be right.", "precondition": "At least one confirmed cross-border transfer (a remittance) between my accounts.", "steps": ["Open Transactions from the Money group and press Find transfers in the Transfers panel.", "In the Confirmed transfers list, find the remittance and press the button beside it that reads No provider recorded.", "Type the provider's name in Provider, type the fee they charged in Fee the provider itemised, choose the Fee currency, then press Save.", "Reload Transactions, press Find transfers and look at that remittance again."], "expected": "The button now reads the provider name I typed instead of No provider recorded, and the small print beside the remittance states its cost, its spread percentage, its achieved rate against the market rate, and the fee I entered. After a reload the same values are still there.", "also_check": "A fee in a currency for which the app has no rate on that transfer's own date is refused with a message rather than converted at a guessed rate, and the remittance is left exactly as it was.", "id": "44-1"}, {"phase": "4.4", "title": "Each currency corridor is judged on its own", "why": "Mixing two corridors would compare rates and costs that have nothing to do with each other and name the wrong provider as cheapest.", "precondition": "Confirmed remittances in two different currency pairs (for example money sent to India and money sent elsewhere).", "steps": ["Open Remittances from the Build & plan group.", "Read the headings on the page and the Sent figure in the strip beneath each one.", "Check each provider table underneath, and the amounts and rates it lists."], "expected": "Each currency pair appears under its own heading (for example AED → INR), with its own years, its own provider table and its own Total row. No amount, rate or cheapest-channel claim is shared between two corridors, and every amount in a corridor is stated in that corridor's sending currency.", "also_check": "With no confirmed remittance at all, the page says so plainly and offers to take me to Transactions rather than showing an empty table of zeros.", "id": "44-2"}, {"phase": "4.4", "title": "Every provider's row adds up, and the rows add up to the Total", "why": "This is the table I would use to choose a provider, so if the parts do not sum to the whole I cannot rely on any of it.", "precondition": "A corridor with at least two remittances that have a recorded cost, ideally spread across two providers.", "steps": ["Open Remittances and pick one corridor and one year.", "For each provider row, add Fees and Spread and compare the result with Total cost.", "Add the Total cost entries down the provider rows (including the No provider recorded row) and compare with the Total row's Total cost.", "Do the same for the Sent column and the Transfers count."], "expected": "In every row, Fees plus Spread equals Total cost exactly. The provider rows' Total cost figures add up to the Total row's Total cost, their Sent figures add up to the Total row's Sent, and their Transfers counts add up to the Total row's count.", "also_check": "A remittance where I achieved a better rate than the market rate for that day keeps its negative Spread in its own row rather than being quietly rounded up to zero.", "id": "44-3"}, {"phase": "4.4", "title": "The effective percentage is of the money it was actually charged on", "why": "A percentage taken over money that has no recorded cost would understate what sending money is really costing me.", "precondition": "A corridor-year containing both remittances with a recorded cost and at least one without.", "steps": ["Open Remittances and find that corridor and year.", "Read the Total row: its Sent figure, its Total cost figure, its Effective percentage and the small print under the word Total.", "Divide the Total cost by the amount the small print says the percentage covers and compare with the Effective percentage.", "Read the Cost tile in the strip at the top of the corridor."], "expected": "Because not everything is costed, the Total row says Effective covers the costed part only, and the Effective percentage equals Total cost divided by that costed amount — not divided by the whole Sent figure. The Cost tile repeats the same percentage and names the smaller amount it was charged on.", "also_check": "In a corridor-year where everything is costed, the note disappears and the percentage is Total cost divided by the full Sent figure.", "id": "44-4"}, {"phase": "4.4", "title": "A group with no recorded cost says so, instead of showing zero", "why": "A zero cost would tell me a channel was free when the truth is that I have not recorded what it charged.", "precondition": "At least one confirmed remittance with no fee recorded and no exchange-rate spread (for example a same-currency transfer), under a provider with no other costed remittance.", "steps": ["Open Remittances and find the row for that provider.", "Read its Fees, Spread, Total cost and Effective entries.", "Read the small print in its Transfers column."], "expected": "Fees, Spread, Total cost and Effective all read Not costed yet rather than a zero amount or 0%, while Sent still shows the money that went through and the Transfers count still counts it. The Transfers column says none costed yet.", "also_check": "A provider whose cost covers only some of its remittances says cost covers part of it beside the count, so a partial total is never read as complete.", "id": "44-5"}, {"phase": "4.4", "title": "A cost resting on a carried-forward rate is marked", "why": "A cost worked out against a stale market rate is an estimate, and I should not treat it as evidence.", "precondition": "At least one confirmed remittance dated on a day with no published market rate (a weekend or holiday), so the rate for that pair was carried forward.", "steps": ["Open Transactions, press Find transfers and read the small print beside that remittance in Confirmed transfers.", "Open Remittances and find the provider row that contains it.", "Read the small print under the Total row of that corridor-year."], "expected": "On Transactions the remittance's cost line ends with a note that it is approximate because the market rate for that day was carried forward. On Remittances the provider row says how many of its transfers rest on a carried-forward rate, and the Total row repeats that count — and the count matches the number of such remittances I can find in the corridor.", "also_check": "Those remittances are still included in the sums; the label qualifies the total rather than removing money from it.", "id": "44-6"}, {"phase": "4.4", "title": "Unlabelled remittances are listed, but kept out of the comparison", "why": "Money I forgot to label must not vanish from my totals, and must not be credited to some provider that did not carry it.", "precondition": "At least one confirmed remittance with no provider recorded, in a corridor that also has named providers.", "steps": ["Open Remittances and find the row labelled No provider recorded in that corridor-year.", "Check that its Sent figure is included in the Total row's Sent figure.", "Read the note beneath the row label and follow the link it offers to Transactions.", "Record the provider for one of those remittances, then return to Remittances and reload."], "expected": "The No provider recorded row shows its own transfer count and Sent figure and is counted in the Total row, and it says Outside the comparison with a link offering to label those transfers on Transactions. It is never named as the cheapest channel. After I label one, that remittance moves out of this row and into the named provider's row, and both the row counts and the Total row still add up.", "also_check": "The unattributed row is shown once per corridor-year and is not split into sub-rows by anything the app guessed.", "id": "44-7"}, {"phase": "4.4", "title": "The cheapest channel only appears once there is something to compare", "why": "Being told one provider is cheapest when it is the only one I have recorded is not a comparison, and would give me false confidence.", "precondition": "A corridor-year with exactly one named provider that has a recorded cost, and a second corridor-year (or the same one, later) with two.", "steps": ["Open Remittances and read the line beside the year heading for the corridor-year that has only one costed provider, and the Cheapest channel tile in the strip.", "Record a provider and fee on a remittance carried by a second provider in that corridor and year, on Transactions.", "Return to Remittances, reload, and read the same line, tile and table again."], "expected": "With one costed provider, the year line reads that a cheapest channel needs two providers with a recorded cost and the Cheapest channel tile reads No comparison — no provider is marked. With two, one provider row carries a Cheapest tag, and that tagged provider is the one with the lowest Effective percentage in the table. The stated saving is never larger than the Total cost in that year's Total row.", "also_check": "When the cheapest provider's own cost is negative because it beat the market rate, the stated saving stops at what I actually paid rather than promising a profit.", "id": "44-8"}, {"phase": "4.4", "title": "Correcting only a provider name never moves a recorded cost", "why": "Fixing a spelling must not silently re-price a transfer I already have evidence for.", "precondition": "A confirmed remittance with both a provider name and a fee already recorded, and its cost visible.", "steps": ["Open Transactions, press Find transfers and write down that remittance's cost, spread percentage and achieved rate exactly as shown.", "Press the provider button beside it, change only the spelling in Provider, and press Save.", "Read the cost line beside that remittance again, then reload the page and read it once more.", "Open Remittances and check that corridor-year's Total row."], "expected": "The cost, spread percentage, achieved rate and fee are digit-for-digit what I wrote down; only the provider name changed. On Remittances the money has moved to the corrected provider's row and the corridor-year Total row shows exactly the same totals as before.", "also_check": "Clearing the fee field and saving returns the cost to the exchange-rate-spread figure alone (or to Not costed yet if there was no spread), and saving the same correction twice leaves the same figures rather than adding the fee twice.", "id": "44-9"}, {"phase": "4.7", "title": "Owner workspace experience — superseded, nothing to accept here", "why": "I should not be asked to sign off a direction I already rejected, and the record should not claim I did.", "precondition": "None. This is a records check, not a screen test.", "steps": ["Read the Phase 4.7 entry in the project's progress record and confirm it says superseded and not owner-accepted.", "Confirm that the visual and layout acceptance I am asked for is recorded against Phase 4.8 instead.", "Spot-check two or three screens for leftovers of the rejected look: warm beige or parchment backgrounds, serif page titles, large motivational intro copy, promotional artwork, or grids of oversized rounded metric cards."], "expected": "Phase 4.7 is marked superseded and never owner-accepted: only the earlier part of it was ever merged, later tasks were stopped, and Phase 4.8 replaced the direction. No screen still shows beige backgrounds, serif titles, hero cards or promotional panels. There is nothing in Phase 4.7 for me to accept; acceptance belongs to the Phase 4.8 cases below.", "also_check": "If any screen still shows the old beige or serif treatment, that is a Phase 4.8 defect, not a Phase 4.7 acceptance question.", "id": "47-1"}, {"phase": "4.8", "title": "One console, the same on every screen", "why": "If later screens look unfinished next to the first ones, I stop trusting that the whole thing was actually built.", "precondition": "Signed in, on a normal laptop-sized window.", "steps": ["Visit every destination in the sidebar in turn: Overview, Accounts, Transactions, Spending, Subscriptions, Recurring, Investments, Salary, Remittances, Plans, Wealth, Import, Import investments, Classify, Documents, Coverage and Settings.", "On each one, check the sidebar stays in place with its groups Money, Build & plan, Review and Workspace, and that the destination I am on is the highlighted one.", "Check each page opens with a compact title, at most one line of context, and its actions on that same top row.", "Check the reporting-currency switch and Sign out stay in the top bar, and switch currency on one screen with amounts."], "expected": "Every screen uses the same white surfaces, cool-grey structure, blue action colour and sans-serif type; the sidebar never scrolls away or changes order; Settings stays at the bottom of the sidebar; exactly one page title per screen; and no screen has a different look or layout system of its own. Switching reporting currency restates amounts in the chosen currency and the currency shown in the totals matches the switch.", "also_check": "While a screen is loading it keeps its title and table shape and says it is loading — it never briefly shows zeros, an empty table or an all-clear state that later changes.", "id": "48-1"}, {"phase": "4.8", "title": "Usable on my phone", "why": "I check balances and commitments away from my desk, and a page I cannot read sideways is a page I will not use.", "precondition": "Signed in on a phone, or a browser window narrowed to phone width.", "steps": ["Open Overview at phone width and press the menu button in the top bar.", "Navigate to Transactions, Remittances and Coverage through that menu.", "On each, try to scroll the page sideways.", "Scroll one wide table sideways inside itself, and find the amount and the main action on a row."], "expected": "The menu opens as a panel with the same grouped navigation and closes when I choose a destination. Metrics stack into one column. The page itself never scrolls sideways at any width; only a wide table scrolls, inside its own area. Every row's status, amount and main action are reachable by tapping, with nothing depending on hovering.", "also_check": "Closing the menu or a row panel puts the highlight back on the control I opened it with, so keyboard and screen-reader use does not lose its place.", "id": "48-2"}, {"phase": "4.8", "title": "Search from the top bar finds records without exposing identifiers", "why": "Search is how I jump to an account or a payment, and it must not be the place my full account numbers leak out.", "precondition": "Signed in, with accounts, transactions, documents, holdings and at least one goal or commitment recorded.", "steps": ["Click the search box in the top bar and type a single character.", "Type enough of an account or merchant name to make two characters or more.", "Move through the results with the arrow keys and press Enter on one.", "Search for part of an account number and read the results."], "expected": "One character produces no results list at all. From two characters, results appear grouped under headings such as Accounts, Transactions, Documents, Holdings, Goals, Commitments and Register, with a spoken count; arrow keys move through them and Enter opens the record. Account results show only the masked form of an identifier — never a full account number — and no result shows a filename or any statement text.", "also_check": "Clearing the box empties the result list rather than leaving stale results behind.", "id": "48-3"}, {"phase": "4.8", "title": "The ledger's summary matches the filter I applied", "why": "A summary that ignores my filter, or quietly counts transfers as spending, would make me misread any month I look at.", "precondition": "A month with imported transactions including at least one confirmed transfer and at least one refund.", "steps": ["Open Transactions and filter to one month and one account.", "Read the Reportable income, Reportable spending and Needs review tiles above the ledger.", "Change the category filter and watch all three tiles.", "Use the browser Back button and check both the filters and the tiles."], "expected": "The tiles restate themselves for each filter I apply and are labelled as reportable, with the note that refunds reduce spending. Needs review equals the number of rows the ledger itself marks as needing review or a category for that same filter. Back restores both the previous filters and the matching tiles.", "also_check": "A filter that selects only transfers truthfully shows zero reportable spending even though the ledger below still lists those rows.", "id": "48-4"}, {"phase": "Invariants", "title": "Last March is still last March", "why": "If yesterday's exchange rates can change last year's figures, then no historical number I have ever read was real.", "precondition": "At least one fully imported past month with foreign-currency transactions, and a Spending total I can write down.", "steps": ["Open Spending, choose that past month and write down the total and two category figures exactly.", "Open a transaction from that month on Transactions and write down its amount, its currency, and the rate and rate date shown beside it.", "Open Settings, choose Exchange rates, and run Backfill rates over a date range covering that month.", "Return to Spending, choose the same month again, and reopen that transaction on Transactions."], "expected": "The month's total and both category figures are digit-for-digit what I wrote down, and the transaction's own amount and currency are unchanged. The rate and rate date shown on the transaction are the ones fixed when it was imported, not today's.", "also_check": "Nowhere in the app can I edit a transaction's original amount or currency — only notes, categories and links.", "id": "INV-1"}, {"phase": "Invariants", "title": "Net worth is one honest sum", "why": "If liabilities are handled with a special case somewhere, my net worth can be wrong by twice a loan.", "precondition": "At least one asset account with a balance and one liability (a credit card or a loan) with a balance owed.", "steps": ["Open Accounts and write down the Assets and Liabilities figures from the top strip.", "Open Overview and read Net position, and the as-of date and currency beside it.", "Subtract the Liabilities figure from the Assets figure and compare with Net position.", "Check that the reporting currency in the top bar is the same on both screens."], "expected": "Assets minus Liabilities equals Net position exactly, in the same currency and as of the same date. Each liability account's own row carries a negative balance from my point of view, and the Liabilities tile says how many accounts it covers.", "also_check": "If any account has no value in the reporting currency, the figures say Not available rather than quietly leaving that account out of the sum.", "id": "INV-2"}, {"phase": "Invariants", "title": "Moving my own money is never spending", "why": "Money moved between my own accounts, counted as spending, would make me think I am overspending every month I remit.", "precondition": "Two of my own accounts with a matching pair of transactions (money out of one, in to the other) in a month whose Spending figure I can write down.", "steps": ["Open Spending, choose that month and write down the total.", "Open Transactions, press Find transfers, tick that pair and press Confirm selected.", "Return to Spending, choose the same month and read the total.", "Open Transactions for that month and find both rows of the pair."], "expected": "The Spending total falls by exactly the amount that left the sending account — not by more, not by both legs. Both rows are still visible in the ledger, each marked TRANSFER and named as a movement from one account to the other, and neither appears in any Spending category for that month.", "also_check": "Pressing Unlink on that transfer restores the Spending total to the figure I first wrote down; the disclosure on Spending, What counts as spending, states that transfers, card payments and investment legs are excluded.", "id": "INV-3"}, {"phase": "Invariants", "title": "Paying my credit card is not spending twice", "why": "The purchase already counted as spending; counting the payment too would double every month's card spending.", "precondition": "A credit-card account with at least one imported purchase, and a payment from a bank account to that card in the same month.", "steps": ["Open Spending, choose that month and note the total and the category the purchase fell into.", "Open Transactions, press Find transfers and confirm the pairing of the bank payment with the card payment row.", "Return to Spending, choose the same month, and open the underlying transactions from the category containing the purchase."], "expected": "That month's spending includes the purchase once, at the purchase amount, and does not include the card payment at all. The payment's two rows are marked TRANSFER on Transactions. The month's total does not move up by the payment amount when I confirm the pairing.", "also_check": "A refund on the card reduces that month's spending rather than appearing as income.", "id": "INV-4"}, {"phase": "Invariants", "title": "Every imported row can be traced back to its statement", "why": "If I cannot get from a figure back to the page of the statement it came from, I cannot defend or correct it.", "precondition": "At least one committed statement import.", "steps": ["Open Transactions and pick several rows marked Imported, across more than one account.", "Open the actions menu at the end of each row and read the entry naming a page and row number.", "Follow that entry and check the document that opens.", "Open Documents and find the same statement in the library."], "expected": "Every imported row offers a page and row reference that opens the original statement it came from. No imported row is missing that reference. The document opens through the app while I am signed in, and Documents lists the same statement with its type, account and period.", "also_check": "A transaction I entered by hand simply has no page-and-row entry — it is not given a fake one.", "id": "INV-5"}, {"phase": "Invariants", "title": "Nothing is invented without saying so", "why": "An estimate dressed up as evidence is the one failure that would make me act on a number that was never real.", "precondition": "At least one transaction dated on a weekend or holiday, an account valued by a recorded snapshot, and a remittance costed against a carried-forward rate.", "steps": ["Open Transactions and read the rate line at the end of a row dated on a non-business day.", "Open Overview and read the section headed Why some figures may be incomplete.", "Open Wealth and look at a month that is not complete, in both the chart and the table.", "Open Remittances and read the small print under a Total row."], "expected": "A rate that was carried forward says carried forward next to the rate and its date. Overview lists, in plain words, each reason a figure may be incomplete — carried-forward rates, missing reporting values, coverage problems — instead of presenting a clean total. An incomplete month on Wealth is a gap in the chart and is labelled Incomplete month in the table, never zero. A remittance cost resting on a carried-forward rate is counted but labelled.", "also_check": "An account valued from a recorded snapshot says the snapshot's date and that it is carried fo
