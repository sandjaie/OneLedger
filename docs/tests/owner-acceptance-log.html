rward, rather than implying a fresh valuation today.", "id": "INV-6"}, {"phase": "Invariants", "title": "A statement that does not balance does not get in", "why": "A half-parsed statement is the likeliest way my ledger becomes quietly wrong, and absent data at least announces itself.", "precondition": "A statement file that the app cannot fully read, or one whose declared closing balance will not match its rows.", "steps": ["Open Import from the Review group and upload that statement.", "Read the summary: the period, the row count, the declared closing balance and the sentence about reconciliation.", "Look for a Stage batch button.", "Open Transactions for that period and check whether anything from the file appears."], "expected": "The summary states plainly that the statement does not reconcile and lists any rows it could not read, with page and row numbers. No Stage batch button is offered — at most an option to remap the layout. Nothing from that file appears anywhere in the ledger.", "also_check": "For a statement that does reconcile, staging says Staged for review. Nothing is in the ledger yet, and rows only enter the ledger after I accept them and press the Import button on Review.", "id": "INV-7"}, {"phase": "Invariants", "title": "Account numbers stay masked until I ask", "why": "This app holds my whole financial identity; a full account number on screen by default is a number waiting to be photographed.", "precondition": "At least one account with a stored identifier, and ideally one whose statement only ever printed a masked value.", "steps": ["Open Accounts and read the identifier shown under each account.", "Press the eye button beside one identifier and read what appears.", "Press it again.", "Find an account whose statement printed only a masked value and try its eye button."], "expected": "Identifiers are masked by default — a few characters at most. Pressing the eye button reveals the stored value only for that one identifier, and pressing it again hides it; nothing else on the page changes and no other account is revealed. For an account where the statement gave only a mask, the app says the statement supplied only a masked value and offers nothing to reveal.", "also_check": "No search result, document row, error message or exported file anywhere shows a full account number, and government identity numbers appear only as their last four characters.", "id": "INV-8"}, {"phase": "Invariants", "title": "The app never asks for anything that could move my money", "why": "The single strongest protection here is that even a total compromise of this app cannot make a payment.", "precondition": "Signed in, with one password-protected statement PDF to hand.", "steps": ["Walk through Accounts, Settings, Import and Transactions looking for any field asking for a bank password, internet-banking login, card CVV, UPI PIN or one-time code.", "Upload the password-protected statement on Import and read the note under the password field.", "Complete that import, then reload Import and look for the password again.", "Look anywhere in Settings for a stored list of institution credentials."], "expected": "No screen anywhere asks for a bank password, internet-banking credential, card CVV, UPI PIN or one-time code. The statement password field is the only password in the app and states it is used for that file only and is not saved; after the import it is gone and is never shown back to me. There is no stored credential list in Settings.", "also_check": "No screen offers to make a payment, transfer money at an institution or place a trade — the app only records what already happened.", "id": "INV-9"}, {"phase": "Invariants", "title": "Only my session gets in, and signing out really ends it", "why": "This is a single-owner ledger; another signed-in account seeing any part of it, or an old session still working, would be the worst possible failure.", "precondition": "Signed in as the owner, with a second account available to try signing in with.", "steps": ["Read the owner name and Personal workspace label in the top bar.", "Press Sign out, then press the browser Back button and try to reload a data screen such as Overview or Transactions.", "Attempt to sign in with a different account.", "Sign back in as the owner and reopen a statement from Documents."], "expected": "After signing out, Back and reload do not show any financial data — I land on a sign-in screen instead, and the old session no longer works. A different account is refused with a message that the account is not authorized, and it never reaches any data screen even briefly. Signing back in as the owner restores everything, and statements open only while signed in.", "also_check": "Leaving the app open for a long time eventually requires signing in again rather than silently extending the session.", "id": "INV-10"}]</script>
<script id="app-js">
(function () {
  "use strict";

  var PHASES = readJson("phases", []);
  var cases = readJson("cases", []);
  var state = readJson("state", { verdicts: {}, notes: {}, rev: 0 });
  if (!state.verdicts) state.verdicts = {};
  if (!state.notes) state.notes = {};

  var VERDICTS = [
    { key: "pass", label: "Accepted" },
    { key: "fail", label: "Not accepted" },
    { key: "blocked", label: "Can't test yet" }
  ];
  var STORE_NAME = "oneledger acceptance log";
  var filter = { group: "all", only: "all" };
  var openIds = {};        // cases the owner has opened this visit
  var openEverything = false;
  var syncNote = "Your verdicts and notes are saved in this browser as you go. Use the same browser to carry on, and print to PDF for a copy to keep.";

  function readJson(id, fallback) {
    try {
      var el = document.getElementById(id);
      return el ? JSON.parse(el.textContent) : fallback;
    } catch (e) { return fallback; }
  }

  // Per-device fallback, so ticking still works when the page cannot republish.
  function loadLocal() {
    try {
      var raw = window.localStorage.getItem(STORE_NAME);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== "object") return;
      if ((saved.rev || 0) >= (state.rev || 0)) {
        state.verdicts = Object.assign({}, state.verdicts, saved.verdicts || {});
        state.notes = Object.assign({}, state.notes, saved.notes || {});
      }
    } catch (e) { /* private window, blocked storage: the page still works */ }
  }
  function saveLocal() {
    try { window.localStorage.setItem(STORE_NAME, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function groupOf(phase) {
    var major = String(phase).split(".")[0];
    return /^\d+$/.test(major) ? major : "x";
  }
  function counts(list) {
    var out = { pass: 0, fail: 0, blocked: 0, open: 0 };
    list.forEach(function (c) {
      var v = state.verdicts[c.id];
      if (v === "pass" || v === "fail" || v === "blocked") out[v] += 1; else out.open += 1;
    });
    return out;
  }
  function visible() {
    return cases.filter(function (c) {
      if (filter.group !== "all" && groupOf(c.phase) !== filter.group) return false;
      var v = state.verdicts[c.id];
      if (filter.only === "open") return !v;
      if (filter.only === "fail") return v === "fail";
      if (filter.only === "blocked") return v === "blocked";
      return true;
    });
  }

  function render() {
    var shown = visible();
    var all = counts(cases);
    var total = cases.length || 1;
    var pct = function (n) { return (n / total * 100).toFixed(3) + "%"; };

    var groups = [{ key: "all", label: "Every phase" }];
    PHASES.forEach(function (p) {
      var k = groupOf(p.phase);
      if (!groups.some(function (g) { return g.key === k; })) {
        groups.push({ key: k, label: k === "x" ? "Cross-cutting" : "Phase " + k + ".x" });
      }
    });

    var html = ""
      + '<div class="masthead">'
      + '<p class="kicker">Owner acceptance</p>'
      + "<h1>OneLedger Acceptance Log</h1>"
      + '<p class="standfirst">Every capability built so far, from the first runtime safeguards to FX and remittance analysis, written as something you can do and a result you can check. No code, no test names — open the app beside this page and work down it.</p>'
      + '<div class="howto"><h2>How to use this</h2><ul>'
      + "<li>Work a phase at a time. Each card gives you a <b>precondition</b>, the <b>steps</b>, and what must be true for it to count as <b>accepted</b>.</li>"
      + "<li>Mark <b>Accepted</b> only when the stated result is exactly what you saw. Anything else is <b>Not accepted</b> — add a note saying what you got instead.</li>"
      + "<li><b>Can't test yet</b> is for cases waiting on data you have not gathered, such as complete investment history. That is a real outcome, not a failure.</li>"
      + "<li>Your verdicts and notes save as you go, so you can stop and come back.</li>"
      + "</ul></div></div>"

      + '<div class="bar">'
      + '<div class="tally">'
      + '<span class="tally-figure"><b>' + all.pass + "</b> accepted</span>"
      + '<span class="tally-sep">·</span><span class="tally-figure"><b>' + all.fail + "</b> not accepted</span>"
      + '<span class="tally-sep">·</span><span class="tally-figure"><b>' + all.blocked + "</b> can’t test yet</span>"
      + '<span class="tally-sep">·</span><span class="tally-figure"><b>' + all.open + "</b> still to review</span>"
      + '<span class="tally-sep">·</span><span class="tally-figure">' + cases.length + " in total</span>"
      + "</div>"
      + '<div class="filters">'
      + groups.map(function (g) {
          return '<button class="chip" type="button" data-group="' + esc(g.key) + '" aria-pressed="'
            + (filter.group === g.key) + '">' + esc(g.label) + "</button>";
        }).join("")
      + '<button class="chip" type="button" data-only="open" aria-pressed="' + (filter.only === "open") + '">Still to review</button>'
      + '<button class="chip" type="button" data-only="fail" aria-pressed="' + (filter.only === "fail") + '">Not accepted</button>'
      + '<button class="chip" type="button" data-only="blocked" aria-pressed="' + (filter.only === "blocked") + '">Can’t test yet</button>'
      + '<button class="chip" type="button" data-openall="1" aria-pressed="' + openEverything + '">'
      + (openEverything ? "Close all steps" : "Open all steps") + "</button>"
      + "</div>"
      + '<div class="meter" role="img" aria-label="' + all.pass + " accepted, " + all.fail + " not accepted, " + all.blocked + " can’t test yet, out of " + cases.length + '">'
      + '<span class="m-pass" style="width:' + pct(all.pass) + '"></span>'
      + '<span class="m-fail" style="width:' + pct(all.fail) + '"></span>'
      + '<span class="m-blocked" style="width:' + pct(all.blocked) + '"></span>'
      + "</div>"
      + '<p class="sync">' + esc(syncNote) + "</p>"
      + "</div>";

    if (!shown.length) {
      html += '<div class="empty">Nothing matches that filter.</div>';
    }

    PHASES.forEach(function (p) {
      var mine = shown.filter(function (c) { return c.phase === p.phase; });
      if (!mine.length) return;
      var c2 = counts(mine);
      html += '<section class="phase" id="phase-' + esc(p.phase).replace(/\./g, "-") + '">'
        + '<div class="phase-head"><span class="phase-num">' + esc(p.label) + "</span>"
        + "<h2>" + esc(p.title) + "</h2>"
        + '<span class="phase-state">' + c2.pass + "/" + mine.length + " accepted</span></div>"
        + (p.note ? '<p class="phase-note">' + p.note + "</p>" : "");
      mine.forEach(function (c) { html += caseHtml(c); });
      html += "</section>";
    });

    html += "<footer>Generated from the approved roadmap outcomes and each phase's own acceptance criteria. "
      + "Phase 4.7 was superseded by Phase 4.8 and is listed only so nothing looks missing.</footer>";

    document.getElementById("app").innerHTML = html;
  }

  function caseHtml(c) {
    var v = state.verdicts[c.id] || "";
    var stamp = v === "pass" ? "Accepted" : v === "fail" ? "Not accepted" : v === "blocked" ? "Can’t test yet" : "To review";
    var open = openEverything || openIds[c.id] === true;
    return '<article class="case" data-verdict="' + esc(v) + '" data-id="' + esc(c.id) + '">'
      + '<div class="case-head">'
      + '<span class="case-id">' + esc(c.id) + "</span>"
      + '<div style="flex:1 1 auto;min-width:0">'
      + '<h3 class="case-title">' + esc(c.title) + "</h3>"
      + '<p class="case-why">' + esc(c.why) + "</p>"
      + "</div>"
      + '<span class="stamp">' + stamp + "</span>"
      + '<button class="toggle" type="button" data-toggle="' + esc(c.id) + '" aria-expanded="' + open + '">'
      + (open ? "Hide" : "Open") + "</button>"
      + "</div>"
      + '<div class="case-body"' + (open ? "" : " hidden") + ">"
      + (c.precondition ? '<p class="lbl">Before you start</p><p class="pre">' + esc(c.precondition) + "</p>" : "")
      + '<p class="lbl">Do this</p><ol class="steps">'
      + (c.steps || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("")
      + "</ol>"
      + '<div class="accepted"><p class="lbl">Accepted when</p><p>' + esc(c.expected) + "</p></div>"
      + (c.also_check ? '<div class="also"><strong>Also worth checking:</strong> ' + esc(c.also_check) + "</div>" : "")
      + '<div class="verdict">'
      + VERDICTS.map(function (x) {
          return '<button type="button" data-v="' + x.key + '" data-case="' + esc(c.id) + '" aria-pressed="'
            + (v === x.key) + '">' + x.label + "</button>";
        }).join("")
      + "</div>"
      + '<textarea class="note" id="note-' + esc(c.id) + '" data-note="' + esc(c.id)
      + '" placeholder="What you saw, or what is holding this up">' + esc(state.notes[c.id] || "") + "</textarea>"
      + "</div></article>";
  }

  // ---------- persistence ----------

  function persist() {
    state.rev = (state.rev || 0) + 1;
    saveLocal();
    syncNote = "Saved in this browser at " + new Date().toLocaleTimeString() + ".";
    paintSync();
  }

  function paintSync() {
    var el = document.querySelector(".sync");
    if (el) el.textContent = syncNote;
  }

  // ---------- events ----------

  document.addEventListener("click", function (event) {
    var t = event.target.closest("button");
    if (!t) return;

    if (t.dataset.v && t.dataset.case) {
      var id = t.dataset.case;
      openIds[id] = true;
      state.verdicts[id] = state.verdicts[id] === t.dataset.v ? "" : t.dataset.v;
      if (!state.verdicts[id]) delete state.verdicts[id];
      persist();
      render();
      var again = document.querySelector('[data-case="' + id + '"][data-v="' + t.dataset.v + '"]');
      if (again) again.focus();
      return;
    }
    if (t.dataset.toggle) {
      var card = t.closest(".case");
      var body = card.querySelector(".case-body");
      var nowOpen = body.hidden;
      body.hidden = !nowOpen;
      openIds[t.dataset.toggle] = nowOpen;
      t.setAttribute("aria-expanded", String(nowOpen));
      t.textContent = nowOpen ? "Hide" : "Open";
      return;
    }
    if (t.dataset.openall) { openEverything = !openEverything; render(); return; }
    if (t.dataset.group) { filter.group = t.dataset.group; render(); return; }
    if (t.dataset.only) {
      filter.only = filter.only === t.dataset.only ? "all" : t.dataset.only;
      render();
    }
  });

  document.addEventListener("input", function (event) {
    var area = event.target;
    if (!area.dataset || !area.dataset.note) return;
    var id = area.dataset.note;
    openIds[id] = true;
    if (area.value.trim()) state.notes[id] = area.value; else delete state.notes[id];
    persist();
  });

  // ---------- boot ----------

  loadLocal();
  render();

})();
</script>
</body>
</html>
