# This file is the deployment (ADR-0014). The same compose file runs on a laptop and on the
# VPS; only .env and whether Caddy is enabled differ.
services:
  db:
    image: postgres:18
    environment:
      # The same three variables the API and Flyway read. Hardcoding them here created the
      # database under one identity while every client was configured with another.
      POSTGRES_USER: ${POSTGRES_USER:-oneledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oneledger}
      POSTGRES_DB: ${POSTGRES_DB:-oneledger}
    # Loopback only. ADR-0014 exposes Caddy and nothing else; a short-form mapping would
    # publish Postgres on every host interface, reachable the moment a firewall rule slips.
    # DB_PORT lets a scratch stack run beside the working one without a port clash.
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    # 18+ stores data in a major-version subdirectory, so the mount goes one level up.
    # Mounting /var/lib/postgresql/data is the <=17 convention and the image refuses to
    # start on it.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oneledger} -d ${POSTGRES_DB:-oneledger}"]
      interval: 5s
      retries: 10

  # The database the live test suite truncates, and the only one it is allowed to reach.
  #
  # `api/tests/*_live.py` empties `transaction`, `import_batch`, `document`,
  # `statement_layout` and `classification_rule` on every fixture. Pointed at the working
  # database that is not a test run, it is data loss — which is exactly what happened on
  # 10 September 2026, taking 4,184 imported transactions and four layout profiles with it.
  # The tests now read `ONELEDGER_TEST_DSN` and nothing else, so the working credentials in
  # `.env` cannot reach them however the environment is arranged.
  #
  # Behind the `test` profile, so `docker compose up -d` does not start it and the working
  # stack costs nothing extra:  docker compose --profile test up -d db-test
  db-test:
    image: postgres:18
    profiles: ["test"]
    environment:
      POSTGRES_USER: oneledger
      POSTGRES_PASSWORD: oneledger
      POSTGRES_DB: oneledger_test
    # A different port and a different volume from `db`. Both, deliberately: sharing either
    # is how the two become one database again.
    ports: ["127.0.0.1:${TEST_DB_PORT:-55434}:5432"]
    volumes: ["pgdata_test:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneledger -d oneledger_test"]
      interval: 5s
      retries: 10

  # Migrates `db-test`, on demand:  docker compose --profile test run --rm flyway-test migrate
  flyway-test:
    image: flyway/flyway:13.5.0-alpine
    profiles: ["test"]
    environment:
      FLYWAY_URL: jdbc:postgresql://db-test:5432/oneledger_test
      FLYWAY_USER: oneledger
      FLYWAY_PASSWORD: oneledger
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "20"
    volumes: ["./db/migrations:/flyway/sql:ro"]
    depends_on:
      db-test: { condition: service_healthy }

  # The daily encrypted dump (security-and-privacy.html §9), taken without anyone remembering.
  # On 10 September 2026 the ledger was lost twice and the newest backup was three days old:
  # scripts/backup-db.sh worked, and nothing ever ran it.
  #
  # Every hour it runs the script with --if-due, which dumps only when the newest backup is
  # more than a day old, then prunes those past thirty days. A failed run is retried on the
  # next tick, and Settings › Data Quality warns once two days pass without one. The api
  # depends on it, so any stack the app can be used on is a stack being backed up.
  backup:
    # The server's own image: pg_dump of the server's major version, and openssl.
    image: postgres:18
    # Deliberately NOT env_file: .env — it needs the connection and the passphrase, not the
    # session secret or the OAuth credentials. libpq reads the connection from PG*, so no
    # character in the password has to survive being parsed out of a URI; the empty URI defers
    # every part to them (scripts/dsn.sh, which assembles one, needs Python this image lacks).
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-oneledger}
      PGPASSWORD: ${POSTGRES_PASSWORD:-oneledger}
      PGDATABASE: ${POSTGRES_DB:-oneledger}
      DATABASE_URL: "postgresql://"
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_DIR: /oneledger/backups
      # ./backups is per checkout, not per project, so each project names its own dumps, as
      # the volumes below are named: a scratch stack's dump of an empty database is neither
      # counted by the ledger's tick and Data Quality nor pruned with the ledger's backups.
      BACKUP_PREFIX: ${COMPOSE_PROJECT_NAME:-oneledger}
    # On a Linux host this runs as root and its dumps are root's, mode 600. Create backups/
    # yourself before the first `up` so the directory stays yours; read a dump with sudo.
    volumes: ["./scripts:/oneledger/scripts:ro", "./backups:/oneledger/backups"]
    # tini passes the stop signal on, so a `docker compose stop` does not wait out the sleep.
    init: true
    entrypoint:
      - bash
      - -c
      - |
        while :; do
          /oneledger/scripts/backup-db.sh --if-due || echo "backup failed; retrying in an hour" >&2
          sleep 3600
        done
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./api
    env_file: .env
    environment:
      # .env points at 127.0.0.1 so `uv run` works on the laptop. Inside this container that
      # is the container itself, so only the host changes — the password is not restated.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Read-only below: GET /doctor reports how old the newest backup is, never touches one.
      BACKUP_DIR: /var/lib/oneledger/backups
      BACKUP_PREFIX: ${COMPOSE_PROJECT_NAME:-oneledger}
    # Loopback, for the same reason as db: on the VPS only Caddy is exposed, and it
    # reaches these over the compose network rather than the host interface.
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - documents:/var/lib/oneledger/documents
      - ./backups:/var/lib/oneledger/backups:ro
    depends_on:
      db: { condition: service_healthy }
      backup: { condition: service_started }

  web:
    build:
      context: ./web
      args:
        # Next.js inlines NEXT_PUBLIC_* at `next build` and freezes them into the bundle.
        # Supplying it at runtime is too late: the browser would fall back to localhost and
        # every hosted visitor would call their own machine instead of the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    # Deliberately NOT env_file: .env. The web service renders and holds no secrets, and
    # handing it the service-wide file would give a compromised dependency SESSION_SECRET,
    # GOOGLE_CLIENT_SECRET, POSTGRES_PASSWORD and ACCOUNT_HASH_SALT — defeating the point
    # of the API being the authorization boundary (ADR-0013).
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  # Runs on demand, never at boot:  docker compose run --rm flyway migrate | info
  flyway:
    image: flyway/flyway:13.5.0-alpine
    profiles: ["tools"]
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-oneledger}
      FLYWAY_USER: ${POSTGRES_USER:-oneledger}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-oneledger}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "20"
    volumes: ["./db/migrations:/flyway/sql:ro"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  # `pgdata` holds the ledger and `documents` holds every original statement it traces back
  # to (I6). Both are EXTERNAL, and that is the whole point: `docker compose down -v` removes
  # a compose-managed volume without asking, and on 10 September 2026 it removed both — once
  # from a plan step that recommended it, once from a `--profile test down -v` that looked
  # scoped to the test stack and was not. `--profile` selects what starts; it does not scope
  # a teardown. An external volume is refused by `down -v`, so the accident stops being
  # possible rather than being remembered against.
  #
  # Create them once, before the first `docker compose up`:
  #     docker volume create oneledger_pgdata
  #     docker volume create oneledger_documents
  #
  # Deleting one is then a deliberate, separate act: `docker volume rm oneledger_pgdata`.
  #
  # The names carry the project's name, and that is what keeps a scratch stack off the ledger.
  # External names are global, not per project: with a fixed name, `COMPOSE_PROJECT_NAME=anything
  # docker compose up -d db` — the verify skill's "migrations from empty" — would mount THIS
  # data directory under a second Postgres. Resolved per project, the default project gets
  # exactly the names above, and any other project names volumes that do not exist, so its `up`
  # is refused instead of borrowing the ledger's. A scratch stack creates its own two first.
  pgdata:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-oneledger}_pgdata
  documents:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-oneledger}_documents
  # Not external. This one exists to be destroyed — `scripts/test-db.sh down` drops it, and
  # the live fixtures empty it on every run.
  pgdata_test:
