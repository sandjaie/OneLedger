# Commit hooks provide fast staged-file feedback. Run the appropriate final
# verifier before the first push; no pre-push hook is installed.
# Install once:
#
#     pre-commit install --install-hooks -t pre-commit
#
# api/ and web/ do not exist until Phase 0 PR 4 and PR 6. Every hook that
# targets them exits cleanly until they arrive, so this file is installable
# from the first commit rather than after the code shows up.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: '^(web/package-lock\.json|api/uv\.lock|docs/product/mockups/)'
      # Whitespace fixers touch code only. docs/ carries ASCII diagrams and
      # <pre> blocks where trailing spaces are load-bearing.
      - id: end-of-file-fixer
        files: '^(api|web|db|scripts)/'
      - id: trailing-whitespace
        files: '^(api|web|db|scripts)/'

  - repo: local
    hooks:
      - id: no-real-data
        name: no real financial data is tracked
        entry: scripts/check-no-real-data.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: markdownlint
        name: markdown — syntax and format
        entry: scripts/hooks/markdown.sh
        language: system
        files: '\.md$'
        exclude: '^(web/node_modules|web/\.next|api/\.venv)/'
        stages: [manual]

      - id: docs
        name: docs — links, html, adr numbering
        entry: python3 scripts/check-docs.py
        language: system
        pass_filenames: false
        files: '^(docs/|README\.md|scripts/check-docs\.py)'

      - id: identifiers
        name: no currency, institution or country name as an identifier
        entry: python3 scripts/check-identifiers.py
        language: system
        pass_filenames: false
        files: '\.(py|ts|tsx|sql|mjs)$'
        exclude: '^(web/node_modules|web/\.next|api/\.venv|web/types/api)/'

      - id: ruff
        name: ruff — lint (api)
        entry: scripts/hooks/api.sh ruff check --fix
        language: system
        files: '^api/.*\.py$'

      - id: ruff-format
        name: ruff — format (api)
        entry: scripts/hooks/api.sh ruff format
        language: system
        files: '^api/.*\.py$'

      - id: eslint
        name: eslint (web)
        entry: scripts/hooks/web.sh lint
        language: system
        files: '^web/.*\.(ts|tsx|js|jsx)$'
